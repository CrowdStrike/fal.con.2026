      | (#Vendor="microsoft" #event.module="entraid" #event.dataset="entraid.signin" user.name=?username !user.name=?exclude_username)
        OR (#Vendor="microsoft" #event.module="defender-identity" #event.dataset="defender-identity.IdentityLogonEvents" Vendor.properties.AccountUpn=?username !Vendor.properties.AccountUpn=?exclude_username)
        OR (#Vendor="zscaler" #event.module="zpa" #event.dataset="zpa.user-status" user.name=?username !user.name=?exclude_username user.name!="ZPA IP Anchor")
        OR (#Vendor="salesforce" #event.module="salesforce" #event.dataset="salesforce.auth" user.name=?username !user.name=?exclude_username)
      | case {
          #event.dataset="entraid.signin" | _app := Vendor.properties.appDisplayName ;
          #event.dataset="defender-identity.IdentityLogonEvents" | _app := Vendor.properties.Application ;
          * | _app := "*" ;
