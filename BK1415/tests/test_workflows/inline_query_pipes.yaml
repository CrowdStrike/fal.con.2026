    id: "test-safe-query-001"
    class: "Inline.QueryEvent"
    inline_configuration:
      config:
        search_query: "#repo=test | a := 1 | b := 2 | c := 3 | d := 4 | e := 5 | f := 6 | g := 7 | h := 8 | table([a])"
        start: 24h
        end: now
        repo_or_view: search-all
