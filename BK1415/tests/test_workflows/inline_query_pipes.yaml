# Test fixture for InlineQueryPipesRule validation.
# Tests three thresholds:
#   SafeQuery:       10 pipes (API count) — should pass silently
#   WarningZoneQuery: 97 pipes (API count) — should trigger INLINE_QUERY_PIPE_WARNING
#   ExceededQuery:   102 pipes (API count) — should trigger INLINE_QUERY_PIPE_EXCEEDED
#
# Run: python3 -m workflow_validator tests/test_workflows/inline_query_pipes.yaml
name: Pipe Count Validation Test
description: Temporary test workflow to verify pipe counting warnings and errors
trigger:
  type: "On demand"
  parameters:
    - name: alertId
      type: investigatableID
