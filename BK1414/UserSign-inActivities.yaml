name: User Sign-in Activities
updateFrequency: never
description: Cross-source user sign-in activity dashboard. Filter by username (UPN/email)
  to see activity across Entra ID, Defender Identity, Zscaler ZPA, Salesforce, CyberArk, 
  Mimecast SSO (via Falcon Sensor), CrowdStrike Falcon Next-Gen Identity Security, and more.
timeSelector: {}
sharedTimeInterval:
  enabled: true
  isLive: false
  start: 7d
widgets:
  a1b2c3d4-0012-4000-8000-000000000012:
    x: 0
    y: 12
    height: 6
    queryString: |
      #Vendor="paloalto" #event.module="ngfw" #event.dataset="ngfw.system"
      //Exlcude "lifted" (duplicate) 3rd party events in xdr telemetry repos
      | #repo!=xdr*
      | (event.action="auth-success" OR event.action="auth-fail")
      | user.name=?username
      | !user.name=?exclude_username
      | source.ip=?source_ip
      | !source.ip=?exclude_source_ip
      | case {
          #event.outcome="success" | Outcome := "success" ;
          #event.outcome="failure" | Outcome := "failure" ;
          * | Outcome := "unknown" ;
        }
      | Outcome=?outcome
      | !Outcome=?exclude_outcome
      | TimeStr := formatTime(format="%Y-%m-%d %H:%M:%S", field=@timestamp)
      | table([TimeStr, user.name, source.ip, observer.hostname, event.action, Outcome], limit=10000)
      | rename([[TimeStr, Time], [user.name, User], [source.ip, "Source IP"], [observer.hostname, Firewall], [event.action, Action], [Outcome, Result]])
      | sort(Time, order=desc, limit=10000)
    end: now
    start: 7d
    width: 6
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns: {}
      row-numbers-enabled: false
    visualization: table-view
    title: Palo Alto NGFW Authentication
    isLive: false
    type: query
  a1b2c3d4-0004e2-entra-risk-medium:
    x: 2
    y: 4
    height: 4
    queryString: |
      #Vendor="microsoft" #event.module="entraid" #event.dataset="entraid.signin"
      //Exlcude "lifted" (duplicate) 3rd party events in xdr telemetry repos
      | #repo!=xdr*
      | user.name=?username
      | !user.name=?exclude_username
      | Vendor.properties.appDisplayName=?app_name
      | !Vendor.properties.appDisplayName=?exclude_app_name
      | case {
          #event.outcome="success" | Outcome := "success" ;
          #event.outcome="failure" | Outcome := "failure" ;
          * | Outcome := "unknown" ;
        }
      | Outcome=?outcome
      | !Outcome=?exclude_outcome
      | Vendor.properties.riskLevelAggregated = "medium"
      | count()
    end: now
    start: 7d
    width: 2
    options:
      default: {}
      text-color: '#E8871E'
    visualization: single-value
    title: 'Entra: Medium Risk Sign-ins'
    isLive: false
    type: query
  a1b2c3d4-0014-4000-8000-000000000014:
    x: 0
    y: 18
    height: 6
    queryString: |
      #Vendor="cisco" #event.module="meraki" #event.dataset="meraki.events"
      //Exlcude "lifted" (duplicate) 3rd party events in xdr telemetry repos
      | #repo!=xdr*
      | (event.action="wifi-8021x-auth" OR event.action="wifi-8021x-failed-authentication-attempt" OR event.action="wifi-8021x-failed-auth-or-deauth")
      | Vendor.identity=?username
      | !Vendor.identity=?exclude_username
      | case {
          event.action="wifi-8021x-auth" | Outcome := "success" ;
          event.action=/wifi-8021x-failed/ | Outcome := "failure" ;
          * | Outcome := "unknown" ;
        }
      | Outcome=?outcome
      | !Outcome=?exclude_outcome
      | Vendor.last_known_client_ip=~wildcard(?source_ip, includeEverythingOnAsterisk=true)
      | Vendor.last_known_client_ip!=?exclude_source_ip
      | TimeStr := formatTime(format="%Y-%m-%d %H:%M:%S", field=@timestamp)
      | table([TimeStr, Vendor.identity, Vendor.last_known_client_ip, log.syslog.hostname, Vendor.client_mac, event.action, Outcome], limit=10000)
      | rename([[TimeStr, Time], [Vendor.identity, User], [Vendor.last_known_client_ip, "Source IP"], [log.syslog.hostname, "Access Point"], [Vendor.client_mac, "Device MAC"], [event.action, Action]])
      | sort(Time, order=desc, limit=10000)
    end: now
    start: 7d
    width: 6
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns: {}
      row-numbers-enabled: false
    visualization: table-view
    title: Meraki 802.1X WiFi Authentication
    isLive: false
    type: query
  a1b2c3d4-0016-4000-8000-000000000016:
    x: 0
    y: 24
    height: 6
    queryString: |
      #Vendor="vmware" #event.module="vcenter" #event.dataset="vcenter.vpxd"
      //Exlcude "lifted" (duplicate) 3rd party events in xdr telemetry repos
      | #repo!=xdr*
      | message=*UserLoginSessionEvent*
      | !user.name=*@127.0.0.1*
      | user.name=?username
      | !user.name=?exclude_username
      | Outcome := "success"
      | Outcome=?outcome
      | !Outcome=?exclude_outcome
      | TimeStr := formatTime(format="%Y-%m-%d %H:%M:%S", field=@timestamp)
      | table([TimeStr, user.name, message], limit=10000)
      | rename([[TimeStr, Time], [user.name, "User (user@IP)"], [message, Event]])
      | sort(Time, order=desc, limit=10000)
    end: now
    start: 7d
    width: 12
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns: {}
      row-numbers-enabled: false
    visualization: table-view
    title: VMware vCenter Admin Sessions
    isLive: false
    type: query
  a1b2c3d4-0003-4000-8000-000000000003:
    x: 4
    y: 6
    height: 5
    queryString: |
      //Exlcude "lifted" (duplicate) 3rd party events in xdr telemetry repos
      #repo!=xdr*
      // Source Inventory & Filtering
        //Entra ID
      | (#Vendor="microsoft" #event.module="entraid" #event.dataset="entraid.signin" 
            user.name=?username !user.name=?exclude_username)
        //Defender for Identity
        OR (#Vendor="microsoft" #event.module="defender-identity" #event.dataset="defender-identity.IdentityLogonEvents" 
            Vendor.properties.AccountUpn=?username !Vendor.properties.AccountUpn=?exclude_username)
        //ZScaler ZPA
        OR (#Vendor="zscaler" #event.module="zpa" #event.dataset="zpa.user-status" 
            user.name=?username !user.name=?exclude_username user.name!="ZPA IP Anchor")
        //SalesForce
        OR (#Vendor="salesforce" #event.module="salesforce" #event.dataset="salesforce.auth" 
            user.name=?username !user.name=?exclude_username)
        //CyberArk Vault
        OR (#Vendor="cyberark" #event.module="vault" 
            source.user.name=?username !source.user.name=?exclude_username)
        //Palo Alto NGFW
        OR (#Vendor="paloalto" #event.module="ngfw" #event.dataset="ngfw.system" 
            (event.action="auth-success" OR event.action="auth-fail") 
            user.name=?username !user.name=?exclude_username)
        //VMware ESXi
        OR (#Vendor="vmware" #event.module="esxi" #event.dataset="esxi.vobd" event.action=*ssh.session* 
            user.name=?username !user.name=?exclude_username)
        //Cisco Meraki
        OR (#Vendor="cisco" #event.module="meraki" #event.dataset="meraki.events" 
            (event.action="wifi-8021x-auth" OR event.action="wifi-8021x-failed-authentication-attempt" OR event.action="wifi-8021x-failed-auth-or-deauth") 
            Vendor.identity=?username !Vendor.identity=?exclude_username)
        //WinEventLog
        OR (#Vendor="microsoft" #event.module="windows" #event.dataset="windows.security" 
            (event.reason="An account was successfully logged on" OR event.reason="An account failed to log on") 
            (Vendor.Event.EventData.LogonType="2" OR Vendor.Event.EventData.LogonType="7" OR Vendor.Event.EventData.LogonType="9" OR Vendor.Event.EventData.LogonType="10" OR Vendor.Event.EventData.LogonType="11") 
            Vendor.Event.EventData.TargetUserName!="-" Vendor.Event.EventData.TargetDomainName!="Window Manager" Vendor.Event.EventData.TargetDomainName!="Font Driver Host" Vendor.Event.EventData.TargetDomainName!="NT AUTHORITY" 
            Vendor.Event.EventData.TargetUserName=?username !Vendor.Event.EventData.TargetUserName=?exclude_username)
        //VMware vCenter
        OR (#Vendor="vmware" #event.module="vcenter" #event.dataset="vcenter.vpxd" 
            message=*UserLoginSessionEvent* !user.name=*@127.0.0.1* 
            user.name=?username !user.name=?exclude_username)
        //F5 Big IP
        OR (#Vendor="f5networks" #event.module="bigip" 
            (log.syslog.facility.code=10 OR log.syslog.facility.code=4) 
            (log.syslog.appname=httpd OR log.syslog.appname="httpd(pam_audit)" OR log.syslog.appname=sshd OR log.syslog.appname="sshd(pam_audit)" OR log.syslog.appname=nslcd OR log.syslog.appname=unix_chkpwd) 
            Vendor.message=/user|auth|AUDIT|session opened|session closed|password/i)
        //Mimecast SSO (via Falcon Sensor)
        OR (#repo=base_sensor #event.dataset=falcon.cloud (event.action=SsoApplicationAccess OR event.action=SsoApplicationAccessFailure) source.user.name=?username !source.user.name=?exclude_username)
      //F5 Big IP username extraction & normalization
      | case {
          #Vendor=f5networks
            | case {
                Vendor.message=/AUDIT - user (?<_user>\S+)/ ;
                Vendor.message=/user=(?<_user>[^\s(]+)\(/ ;
                Vendor.message=/[Aa]uth.*failure.*user=(?<_user>\S+)/ ;
                Vendor.message=/[Aa]uth.*failure for (?<_user>\S+) from/ ;
                Vendor.message=/authc="(?<_user>[^"]+)"/ ;
                Vendor.message=/password check failed for user \((?<_user>[^)]+)\)/ ;
                Vendor.message=/session (?:opened|closed) for user (?<_user>\S+)/ ;
                Vendor.message=/user unknown/ | _user := "(unknown)" ;
                * | _user := "(unparsed)" ;
              }
            | _user != "(unparsed)"
            | _user=~wildcard(?username, includeEverythingOnAsterisk=true)
            | _user!=?exclude_username;
          * | *
        }  
      //Entra ID App filter
      | case {
          #event.dataset="entraid.signin" | _app := Vendor.properties.appDisplayName ;
          #event.dataset="defender-identity.IdentityLogonEvents" | _app := Vendor.properties.Application ;
          * | _app := "*" ;
        }
      | _app=?app_name | !_app=?exclude_app_name

      //Source Labels
      | Source := #event.dataset
      | replace("entraid.signin", with="Entra ID", field=Source)
      | replace("defender-identity.IdentityLogonEvents", with="Defender Identity", field=Source)
      | replace("zpa.user-status", with="Zscaler ZPA", field=Source)
      | replace("salesforce.auth", with="Salesforce", field=Source)
      | replace("vault.audit", with="CyberArk", field=Source)
      | replace("ngfw.system", with="Palo Alto", field=Source)
      | replace("esxi.vobd", with="VMware ESXi", field=Source)
      | replace("meraki.events", with="Meraki 802.1X", field=Source)
      | replace("windows.security", with="Windows AD", field=Source)
      | replace("vcenter.vpxd", with="VMware vCenter", field=Source)
      | replace("bigip.os", with="F5 BIG-IP", field=Source)
      | replace("bigip.system", with="F5 BIG-IP", field=Source)
      | replace("falcon.cloud", with="Mimecast SSO", field=Source)

      //Outcome Normalization
      | case {
          //Standardized (ECS)
          #event.outcome="success" | Outcome := "success" ;
          #event.outcome="failure" | Outcome := "failure" ;
          //ZScaler ZPA
          Vendor.SessionStatus="ZPN_STATUS_AUTHENTICATED" | Outcome := "success" ;
          Vendor.SessionStatus="ZPN_STATUS_AUTH_FAILED" | Outcome := "failure" ;
          Vendor.SessionStatus="ZPN_STATUS_DISCONNECTED" | Outcome := "disconnected" ;
          //Salesforce
          Vendor.LOGIN_STATUS="LOGIN_NO_ERROR" | Outcome := "success" ;
          Vendor.LOGIN_STATUS=* | Outcome := "failure" ;
          //Cisco Meraki
          event.action="wifi-8021x-auth" | Outcome := "success" ;
          event.action=/wifi-8021x-failed/ | Outcome := "failure" ;
          //VMware vCenter
          message=*UserLoginSessionEvent* | Outcome := "success" ;
          //F5 Big IP
          Vendor.message=/AUDIT|session opened|SUCCESS|user=\S+\(\S+\) partition=.*start=/ | Outcome := "success" ;
          Vendor.message=/failure|failed|Invalid credentials|user unknown/i | Outcome := "failure" ;
          //Mimecast SSO (via Falcon Sensor)
          event.action="SsoApplicationAccess" | Outcome := "success" ;
          event.action="SsoApplicationAccessFailure" | Outcome := "failure" ;
          //Catch-all
          * | Outcome := "unknown" ;
        }
      //Exclude unknown outcomes
      | Outcome != "unknown"
      //Outcome parameter filtering
      | Outcome=?outcome
      | !Outcome=?exclude_outcome
      | groupBy([Source, Outcome], function=count(), limit=max)
    visualization: bar-chart
    end: now
    start: 7d
    width: 4
    title: Success/Failure by Source
    isLive: false
    type: query
  a1b2c3d4-0007-4000-8000-000000000007:
    x: 0
    y: 6
    height: 6
    queryString: |
      #Vendor="salesforce" #event.module="salesforce" #event.dataset="salesforce.auth"
      //Exlcude "lifted" (duplicate) 3rd party events in xdr telemetry repos
      | #repo!=xdr*
      | user.name=?username !user.name=?exclude_username
      | Vendor.FORWARDED_FOR_IP=~wildcard(?source_ip, includeEverythingOnAsterisk=true)
      | Vendor.FORWARDED_FOR_IP!=?exclude_source_ip
      | case {
          Vendor.LOGIN_STATUS="LOGIN_NO_ERROR" | Outcome := "success" ;
          Vendor.LOGIN_STATUS=* | Outcome := "failure" ;
          * | Outcome := "unknown" ;
        }
      | Outcome=?outcome
      | !Outcome=?exclude_outcome
      | TimeStr := formatTime(format="%Y-%m-%d %H:%M:%S", field=@timestamp)
      | table([TimeStr, user.name, Vendor.FORWARDED_FOR_IP, Outcome, Vendor.LOGIN_STATUS, Vendor.URI], limit=10000)
      | rename([[TimeStr, Time], [user.name, User], [Vendor.FORWARDED_FOR_IP, "Source IP"], [Outcome, Result], [Vendor.LOGIN_STATUS, "Login Status"], [Vendor.URI, Application]])
      | sort(Time, order=desc, limit=10000)
    end: now
    start: 7d
    width: 8
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns: {}
      row-numbers-enabled: false
    visualization: table-view
    title: Salesforce Logins
    isLive: false
    type: query
  a1b2c3d4-0004g-entra-compliance:
    x: 8
    y: 4
    height: 4
    queryString: |
      #Vendor="microsoft" #event.module="entraid" #event.dataset="entraid.signin"
      //Exlcude "lifted" (duplicate) 3rd party events in xdr telemetry repos
      | #repo!=xdr*
      | user.name=?username !user.name=?exclude_username
      | Vendor.properties.appDisplayName=?app_name
      | !Vendor.properties.appDisplayName=?exclude_app_name
      | case {
          #event.outcome="success" | Outcome := "success" ;
          #event.outcome="failure" | Outcome := "failure" ;
          * | Outcome := "unknown" ;
        }
      | Outcome=?outcome
      | !Outcome=?exclude_outcome
      | case {
          Vendor.properties.deviceDetail.isCompliant="true"  | Compliance := "Compliant" ;
          Vendor.properties.deviceDetail.isCompliant="false" | Compliance := "Non-Compliant" ;
          * | Compliance := "Unknown" ;
        }
      | groupBy(Compliance, function=count(), limit=max)
    visualization: pie-chart
    end: now
    start: 7d
    width: 4
    title: 'Entra: Device Compliance'
    isLive: false
    type: query
  a1b2c3d4-0004f-entra-top-apps:
    x: 4
    y: 4
    height: 4
    queryString: |
      #Vendor="microsoft" #event.module="entraid" #event.dataset="entraid.signin"
      //Exlcude "lifted" (duplicate) 3rd party events in xdr telemetry repos
      | #repo!=xdr*
      | user.name=?username !user.name=?exclude_username
      | Vendor.properties.appDisplayName=?app_name
      | !Vendor.properties.appDisplayName=?exclude_app_name
      | case {
          #event.outcome="success" | Outcome := "success" ;
          #event.outcome="failure" | Outcome := "failure" ;
          * | Outcome := "unknown" ;
        }
      | Outcome=?outcome
      | !Outcome=?exclude_outcome
      | Vendor.properties.appDisplayName != ""
      | top(Vendor.properties.appDisplayName, limit=15)
      | rename([[Vendor.properties.appDisplayName, "Application"], [_count, "Sign-ins"]])
    end: now
    start: 7d
    width: 4
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns: {}
      row-numbers-enabled: false
    visualization: table-view
    title: 'Entra: Top Apps'
    isLive: false
    type: query
  a1b2c3d4-0018-4000-8000-mimecast00001:
    x: 6
    y: 30
    height: 6
    queryString: |
      #repo=base_sensor #event.dataset=falcon.cloud (event.action=SsoApplicationAccess OR event.action=SsoApplicationAccessFailure)
      | source.user.name=?username
      | !source.user.name=?exclude_username
      | case {
          event.action="SsoApplicationAccess" | Outcome := "success" ;
          event.action="SsoApplicationAccessFailure" | Outcome := "failure" ;
          * | Outcome := "unknown" ;
        }
      | Outcome != "unknown"
      | Outcome=?outcome
      | !Outcome=?exclude_outcome
      | source.ip=~wildcard(?source_ip, includeEverythingOnAsterisk=true)
      | source.ip!=?exclude_source_ip
      | TimeStr := formatTime(format="%Y-%m-%d %H:%M:%S", field=@timestamp)
      | case {
          LocationStateCode=~regex("^[0-9]+$") | State := "-" ;
          LocationStateCode="" | State := "-" ;
          * | State := LocationStateCode ;
        }
      | table([TimeStr, source.user.name, Outcome, source.ip, SourceEndpointHostName, LocationCountryCode, State], limit=10000)
      | rename([[TimeStr, Time], [source.user.name, User], [Outcome, Result], [source.ip, "Source IP"], [SourceEndpointHostName, Device], [LocationCountryCode, Country]])
      | sort(Time, order=desc, limit=10000)
    end: now
    start: 7d
    width: 6
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns: {}
      row-numbers-enabled: false
    visualization: table-view
    title: Mimecast SSO Logins
    isLive: false
    type: query
  a1b2c3d4-0015-4000-8000-000000000015:
    x: 6
    y: 18
    height: 6
    queryString: |
      #Vendor="microsoft" #event.module="windows" #event.dataset="windows.security"
      //Exlcude "lifted" (duplicate) 3rd party events in xdr telemetry repos
      | #repo!=xdr*
      | (event.reason="An account was successfully logged on" OR event.reason="An account failed to log on")
      | (Vendor.Event.EventData.LogonType="2" OR Vendor.Event.EventData.LogonType="7" OR Vendor.Event.EventData.LogonType="9" OR Vendor.Event.EventData.LogonType="10" OR Vendor.Event.EventData.LogonType="11")
      | Vendor.Event.EventData.TargetUserName != "-"
      | Vendor.Event.EventData.TargetDomainName != "Window Manager"
      | Vendor.Event.EventData.TargetDomainName != "Font Driver Host"
      | Vendor.Event.EventData.TargetDomainName != "NT AUTHORITY"
      | Vendor.Event.EventData.TargetUserName=?username
      | !Vendor.Event.EventData.TargetUserName=?exclude_username
      | source.ip=~wildcard(?source_ip, includeEverythingOnAsterisk=true)
      | source.ip!=?exclude_source_ip
      | case {
          #event.outcome="success" | Outcome := "success" ;
          #event.outcome="failure" | Outcome := "failure" ;
          * | Outcome := "unknown" ;
        }
      | Outcome=?outcome
      | !Outcome=?exclude_outcome
      | TimeStr := formatTime(format="%Y-%m-%d %H:%M:%S", field=@timestamp)
      | table([TimeStr, Vendor.Event.EventData.TargetUserName, Vendor.Event.EventData.TargetDomainName, source.ip, host.name, Vendor.Event.EventData.LogonType, Outcome], limit=10000)
      | rename([[TimeStr, Time], [Vendor.Event.EventData.TargetUserName, "User (sAMAccountName)"], [Vendor.Event.EventData.TargetDomainName, Domain], [source.ip, "Source IP"], [host.name, Host], [Vendor.Event.EventData.LogonType, "Logon Type"], [Outcome, Result]])
      | sort(Time, order=desc, limit=10000)
    end: now
    start: 7d
    width: 6
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns: {}
      row-numbers-enabled: false
    visualization: table-view
    title: Windows AD Interactive Logons (RDP / Console)
    isLive: false
    type: query
  note-dashboard-header:
    x: 0
    backgroundColor: '#14274E'
    y: 0
    height: 3
    text: |
      Displays authentication events across all ingested identity and access sources. Use the **Username** parameter to filter by a specific user — leave as `*` to see all activity.

      **Sources covered:** Entra ID · Defender Identity · Zscaler ZPA · Salesforce · CyberArk · Palo Alto NGFW · VMware ESXi · Meraki 802.1X · Windows AD · VMware vCenter · F5 BIG-IP · Mimecast SSO (via Falcon Sensor) · CrowdStrike Falcon Next-Gen Identity Security Alerts

      **Outcome filter:** Use `success`, `failure`, or `disconnected` (ZPA only). Works across all sources. 
      
      Last updated: 2026-04-08
    width: 12
    title: User Sign-in Activities Dashboard
    type: note
  a1b2c3d4-0017-4000-8000-f5bigip00001:
    x: 0
    y: 30
    height: 6
    queryString: |
      #Vendor="f5networks" #event.module="bigip"
      //Exlcude "lifted" (duplicate) 3rd party events in xdr telemetry repos
      | #repo!=xdr*
      | (log.syslog.facility.code=10 OR log.syslog.facility.code=4) (log.syslog.appname=httpd OR log.syslog.appname="httpd(pam_audit)" OR log.syslog.appname=sshd OR log.syslog.appname="sshd(pam_audit)" OR log.syslog.appname=nslcd OR log.syslog.appname=unix_chkpwd) Vendor.message=/user|auth|AUDIT|session opened|session closed|password/i
      | case {
          Vendor.message=/AUDIT - user (?<_user>\S+)/ ;
          Vendor.message=/user=(?<_user>[^\s(]+)\(/ ;
          Vendor.message=/[Aa]uth.*failure.*user=(?<_user>\S+)/ ;
          Vendor.message=/[Aa]uth.*failure for (?<_user>\S+) from/ ;
          Vendor.message=/authc="(?<_user>[^"]+)"/ ;
          Vendor.message=/password check failed for user \((?<_user>[^)]+)\)/ ;
          Vendor.message=/session (?:opened|closed) for user (?<_user>\S+)/ ;
          Vendor.message=/user unknown/ | _user := "(unknown)" ;
          * | _user := "(unparsed)" ;
        }
      | _user != "(unparsed)"
      | _user=?username
      | !_user=?exclude_username
      | case {
          Vendor.message=/host=(?<_source_ip>[\d.]+)/ ;
          Vendor.message=/rhost=(?<_source_ip>[\d.]+)/ ;
          Vendor.message=/from (?<_source_ip>[\d.]+)/ ;
          * | _source_ip := "" ;
        }
      | _source_ip=~wildcard(?source_ip, includeEverythingOnAsterisk=true)
      | _source_ip!=?exclude_source_ip
      | case {
          Vendor.message=/level=(?<_level>\S+)/ ;
          * | _level := "" ;
        }
      | case {
          Vendor.message=/AUDIT/ | Outcome := "success" ;
          Vendor.message=/session opened/ | Outcome := "success" ;
          Vendor.message=/SUCCESS/ | Outcome := "success" ;
          Vendor.message=/user=\S+\(\S+\) partition=.*start=/ | Outcome := "success" ;
          Vendor.message=/failure|failed|Invalid credentials|user unknown/i | Outcome := "failure" ;
          Vendor.message=/session closed/ | Outcome := "info" ;
          * | Outcome := "unknown" ;
        }
      | Outcome != "unknown" AND Outcome != "info"
      | Outcome=?outcome
      | !Outcome=?exclude_outcome
      | case {
          log.syslog.appname=/httpd/ | Method := "Web UI" ;
          log.syslog.appname=/sshd/ | Method := "SSH" ;
          log.syslog.appname=nslcd | Method := "LDAP" ;
          log.syslog.appname=unix_chkpwd | Method := "Local" ;
          * | Method := log.syslog.appname ;
        }
      | TimeStr := formatTime(format="%Y-%m-%d %H:%M:%S", field=@timestamp)
      | table([TimeStr, _user, Outcome, Method, _source_ip, log.syslog.hostname, _level, Vendor.message], limit=10000)
      | rename([[TimeStr, Time], [_user, User], [Outcome, Result], [_source_ip, "Source IP"], [log.syslog.hostname, Appliance], [_level, "Access Level"], [Vendor.message, Message]])
      | sort(Time, order=desc, limit=10000)
    end: now
    start: 7d
    width: 6
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns: {}
      row-numbers-enabled: false
    visualization: table-view
    title: F5 BIG-IP Authentication
    isLive: false
    type: query
  a1b2c3d4-0006-4000-8000-000000000006:
    x: 6
    y: 0
    height: 6
    queryString: |
      #Vendor="zscaler" #event.module="zpa" #event.dataset="zpa.user-status"
      //Exlcude "lifted" (duplicate) 3rd party events in xdr telemetry repos
      | #repo!=xdr*
      | user.name=?username !user.name=?exclude_username user.name!="ZPA IP Anchor"
      | client.ip=?source_ip
