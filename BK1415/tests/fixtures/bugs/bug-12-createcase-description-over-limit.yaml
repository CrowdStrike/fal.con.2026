    QueryConsolidatedAuth:
        id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
        inline_configuration:
            input_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    user_email:
                        type: string
                        title: User Email
                        default: user@example.com
                required:
                    - user_email
                type: object
                description: Consolidated auth summary - sign-ins, failures, risk events, MFA breakdown (7d)
            output_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    failure_count:
                        type: string
                        title: Failed Sign-ins (7d)
                    failure_ratio:
                        type: string
                        title: Failure Ratio (%)
                    mfa_count:
                        type: string
                        title: MFA Sign-ins (7d)
                    risk_event_count:
                        type: string
                        title: Risk Event Count (7d)
                    single_factor_count:
                        type: string
                        title: Single-Factor Sign-ins (7d)
                    total_signins:
                        type: string
                        title: Total Sign-ins (7d)
                required:
                    - total_signins
                    - failure_count
                    - risk_event_count
                    - mfa_count
                    - single_factor_count
                type: object
                description: Consolidated auth summary with failures, risk events, and MFA breakdown
            config:
                description: Single consolidated query for all auth signals - replaces QueryAuthAnomalySummary + QueryAuthRiskSignals
                end: now
                last_modified_by: nchurch@crowdstrike.com
                repo_or_view: search-all
                search_name: Query Consolidated Auth (7d)
                search_query: |
                    #repo = "3pi_microsoft_entra_id"
                    | #event.dataset = "entraid.signin"
                    | user.name = ?user_email
                    | rename(field="#event.outcome", as=outcome)
                    | case { outcome = "failure" | failure_flag := 1 ; * | failure_flag := 0 }
                    | case { Vendor.properties.riskState != "none" OR Vendor.properties.riskLevelDuringSignIn != "none" | risk_flag := 1 ; * | risk_flag := 0 }
                    | case { Vendor.properties.authenticationRequirement = "multiFactorAuthentication" | mfa_flag := 1 ; * | mfa_flag := 0 }
                    | [total_signins := count(), failure_count := sum(failure_flag), risk_event_count := sum(risk_flag), mfa_count := sum(mfa_flag)]
                    | failure_ratio := if(total_signins > 0, then=(failure_count * 100) / total_signins, else=0)
                    | round(failure_ratio)
                    | single_factor_count := total_signins - mfa_count
                    | select([total_signins, failure_count, failure_ratio, risk_event_count, mfa_count, single_factor_count])
                search_query_args:
                    user_email: user@example.com
                start: 168h
                tags: []
        class: Inline.QueryEvent
        continue_on_error: true
        name: Query Consolidated Auth (7d)
        next:
            - CalculateRiskScore
        properties:
            output_files_only: false
            user_email: ${data['WorkflowCustomVariable.UserEmail']}
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
        version_constraint: ~1
