# MMB v5.6.0 TEST - Detection-triggered with TEST prefixes for development/validation
# Companion production workflow: MMB_v5.2.2.yaml (detection-triggered, no TEST prefixes)
# Changes from v5.5.0: Early detection type identification, sibling detection close path,
#   case tag isolation (MMB-TEST-v5), removed ExitNonPrimaryDetection

name: TEST-MMBv5.8.0-Mass-Mailing-Behavior
description: 'Auto-triggers on "Email sending limit exceeded" detections. Mass Mailing Behavior (MMB) v5.5.0 — Incident-ID-based deduplication eliminates duplicate executions. Enriches user context, runs 12 parallel branches (auth, recent detections, email baseline, IP/geo, email content, email subjects, mailbox rules, alert history, client agents, Defender enrichment, sign-in IP → VT lookup, XDR recipient count), computes a 5-category risk score (0-116), routes HIGH/MEDIUM to case creation with dedup or LOW to comment-only, and auto-closes companion incident-level detection. v5.5.0: 2h window anchored to detection time via parseTimestamp, empty results guard on QueryCasesByIncidentTag/CreateANewCase incident tags.'
trigger:
    next:
        - detection_name_matches_email_sending_limit
    event: Investigatable
    name: Detection > NG-SIEM Detection
    type: Signal
    version_constraint: ~1
actions:
    AddCommentToCase:
        id: a16f4fdd1b244b0bfeecd47e25dbe0e0
        name: Add Comment to Case - Initial Detection
        next:
            - AddCommentToDetectionForCase
        properties:
            case_id: ${CreateANewCase.id}
            comment: |
                ${data['CalculateRiskScore.results'][0]['attack_story']}

                Risk Level ${data['CalculateRiskScore.results'][0]['risk_level']} (score ${data['CalculateRiskScore.results'][0]['risk_score']}/116) meets case creation threshold (>= 20).

                Detection ID: ${Trigger.Detection.DetectionID}

                User: ${data['WorkflowCustomVariable.UserEmail']}

                Activity Window: ${data['QueryDefenderEnrichment.results'].size() > 0 ? data['QueryDefenderEnrichment.results'][0]['activity_start'] + ' to ' + data['QueryDefenderEnrichment.results'][0]['activity_end'] : 'N/A'}

                Defender Incident: ${data['QueryDefenderEnrichment.results'].size() > 0 ? data['QueryDefenderEnrichment.results'][0]['defender_portal_url'] : 'N/A'}

                Defender Incident ID: ${data['QueryDefenderEnrichment.results'].size() > 0 ? data['QueryDefenderEnrichment.results'][0]['defender_incident_id'] : 'N/A'}

                Scoring: Vol ${data['CalculateRiskScore.results'][0]['email_volume_score']}/40 | Content ${data['CalculateRiskScore.results'][0]['email_content_score']}/15 | Auth ${data['CalculateRiskScore.results'][0]['auth_risk_score']}/26 | Client ${data['CalculateRiskScore.results'][0]['client_agent_score']}/5 | Mailbox ${data['CalculateRiskScore.results'][0]['mailbox_rules_score']}/15 | Alerts ${data['CalculateRiskScore.results'][0]['alerts_correlation_score']}/15 | Mitigating ${data['CalculateRiskScore.results'][0]['hygiene_bonus']} (${data['CalculateRiskScore.results'][0]['hygiene_label']})

                IP Enrichment (VT): Primary IP ${data['CalculateRiskScore.results'][0]['primary_ip']} | ASN: ${data['CalculateRiskScore.results'][0]['vt_as_owner']} | Country: ${data['CalculateRiskScore.results'][0]['vt_country']} | Reputation: ${data['CalculateRiskScore.results'][0]['vt_reputation']}
                Low-freq IPs (24h): ${data['CalculateRiskScore.results'][0]['low_freq_ip_list']}

                Recent Detections (3d):
                "${data['QueryRecentDetections.results'].size() > 0 ? data['QueryRecentDetections.results'][0]['detection_list'] : 'No recent detections'}"
        version_constraint: ~1
    AddCommentToDetection:
        id: 7b77cb5d5ff2651cc51c7c4c610d54d1
        name: Add comment to detection - LOW risk
        properties:
            comment: 'MMB ${data[''CalculateRiskScore.results''][0][''risk_level'']} (${data[''CalculateRiskScore.results''][0][''risk_score'']}/116): ${data[''CalculateRiskScore.results''][0][''attack_story'']} | Defender: ${data[''QueryDefenderEnrichment.results''].size() > 0 ? data[''QueryDefenderEnrichment.results''][0][''defender_portal_url''] : ''N/A''} | Defender ID: ${data[''QueryDefenderEnrichment.results''].size() > 0 ? data[''QueryDefenderEnrichment.results''][0][''defender_incident_id''] : ''N/A''}'
            investigatable_id: ${Trigger.Detection.DetectionID}
        version_constraint: ~0
    AddCommentToDetectionForCase:
        id: 7b77cb5d5ff2651cc51c7c4c610d54d1
        name: Add comment to detection - case created
        next:
            - SetDetectionStatus
        properties:
            _fields:
                - ${CreateANewCase.id}
            comment: 'MMB: Closing detection - added to case:'
            investigatable_id: ${Trigger.Detection.DetectionID}
        version_constraint: ~0
    AddCommentToDetectionForExistingCase:
        id: 7b77cb5d5ff2651cc51c7c4c610d54d1
        name: Add comment to detection - existing case
        next:
            - SetDetectionStatus2
        properties:
            _fields:
                - "${data['QueryCasesByIncidentTag.cases'].size() > 0 ? data['QueryCasesByIncidentTag.cases'][0] : data['QueryCasesByUser.cases'][0]}"
            comment: 'MMB: Closing detection - added to existing case:'
            investigatable_id: ${Trigger.Detection.DetectionID}
        version_constraint: ~0
    AddCompanionClosureComment:
        id: 7b77cb5d5ff2651cc51c7c4c610d54d1
        name: Add comment to detection - companion closed
        continue_on_error: true
        next:
            - RegularUserComplete
        properties:
            comment: "MMB: Auto-closed companion detection ${data['QueryCompanionDetection.results'][0]['companion_detection_id']} (Defender incident ${data['QueryDefenderEnrichment.results'].size() > 0 ? data['QueryDefenderEnrichment.results'][0]['defender_incident_id'] : 'N/A'})"
            investigatable_id: ${Trigger.Detection.DetectionID}
        version_constraint: ~0
    CloseSiblingComment:
        id: 7b77cb5d5ff2651cc51c7c4c610d54d1
        name: Comment - non-primary sibling detection
        next:
            - CloseSiblingDetection
        properties:
            comment: |
                MMB: Non-primary sibling detection (auto-closed).
                This detection is a duplicate XDR indicator for the same incident.
                The primary defender.alerts detection handles enrichment and case creation.
                Dataset: ${data['QueryDetectionDataset.results'].size() > 0 ? data['QueryDetectionDataset.results'][0]['dataset'] : 'saas-security (no dataset)'}
            investigatable_id: ${Trigger.Detection.DetectionID}
        version_constraint: ~0
    CloseSiblingDetection:
        id: beb56cc40d334583671ca91e6e390056
        name: Close detection (non-primary sibling)
        properties:
            investigatable_id: ${Trigger.Detection.DetectionID}
            status: closed
        version_constraint: ~0
    AddDetectionsToCase:
        id: 9ef277cab8186937e5c60a69e05ea4bc
        name: Add detections to case
        next:
            - AddCommentToDetectionForExistingCase
        properties:
            case_id: "${data['QueryCasesByIncidentTag.cases'].size() > 0 ? data['QueryCasesByIncidentTag.cases'][0] : data['QueryCasesByUser.cases'][0]}"
            detections:
                - ${Trigger.Detection.DetectionID}
        version_constraint: ~1
    CalculateRiskScore:
        id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
        inline_configuration:
            input_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    baseline_total:
                        type: string
                        title: Baseline Total (30d)
                        default: "100"
                    bulk_subjects:
                        type: string
                        title: Bulk Subjects (100+ recipients, 2h)
                        default: "5"
                    delete_rules:
                        type: string
                        title: Delete Rules (7d)
                        default: "0"
                    distinct_alert_types:
                        type: string
                        title: Distinct Alert Types (7d)
                        default: "1"
                    distinct_recent_detection_types:
                        type: string
                        title: Distinct Recent Detection Types (3d)
                        default: "1"
                    external_forward_rules:
                        type: string
                        title: External Forwarding Rules (7d)
                        default: "0"
                    external_pct:
                        type: string
                        title: External Recipient Percent (2h)
                        default: "75"
                    failure_count:
                        type: string
                        title: Auth Failure Count (7d)
                        default: "0"
                    forward_rules:
                        type: string
                        title: Forwarding Rules (7d)
                        default: "0"
                    low_freq_ips:
                        type: string
                        title: Low-Frequency IPs (7d)
                        default: "0"
                    mfa_count:
                        type: string
                        title: MFA Sign-in Count (7d)
                        default: "0"
                    risk_event_count:
                        type: string
                        title: Entra ID Risk Event Count (7d)
                        default: "0"
                    smtp_auth_count:
                        type: string
                        title: Authenticated SMTP Sign-ins (24h)
                        default: "0"
                    smtp_pct:
                        type: string
                        title: SMTP Auth Percentage (24h)
                        default: "0"
                    total_client_events:
                        type: string
                        title: Total Client Sign-in Events (24h)
                        default: "0"
                    browser_count:
                        type: string
                        title: Browser Sign-in Count (24h)
                        default: "0"
                    browser_pct:
                        type: string
                        title: Browser Sign-in Percentage (24h)
                        default: "0"
                    desktop_count:
                        type: string
                        title: Desktop/Mobile Sign-in Count (24h)
                        default: "0"
                    desktop_pct:
                        type: string
                        title: Desktop/Mobile Sign-in Percentage (24h)
                        default: "0"
                    other_count:
                        type: string
                        title: Other/Unknown Sign-in Count (24h)
                        default: "0"
                    browser_app:
                        type: string
                        title: Browser App Names
                        default: "N/A"
                    desktop_app:
                        type: string
                        title: Desktop/Mobile App Names
                        default: "N/A"
                    total_alerts:
                        type: string
                        title: Other Alerts (7d)
                        default: "0"
                    total_recent_detections:
                        type: string
                        title: Recent Detections (3d)
                        default: "0"
                    total_rule_changes:
                        type: string
                        title: Total Rule Changes (7d)
                        default: "0"
                    total_signins:
                        type: string
                        title: Total Sign-ins (7d)
                        default: "0"
                    unique_ips:
                        type: string
                        title: Unique IPs (7d)
                        default: "0"
                    user_email:
                        type: string
                        title: User Email
                        default: user@example.com
                    top_subjects:
                        type: string
                        title: Bulk Email Subjects (100+ recipients, 2h)
                        default: "RE: Q1 Sales Forecast (12 rcpts) ; FW: Budget Review Meeting (8 rcpts) ; Team Update - Project Alpha (5 rcpts) ; Monthly Report Submission (3 rcpts) ; Urgent: Client Request (2 rcpts)"
                    top_5_subjects:
                        type: string
                        title: Top 5 Subjects by recipient count (2h)
                        default: "RE: Q1 Sales Forecast (12 rcpts) ; FW: Budget Review Meeting (8 rcpts) ; Team Update - Project Alpha (5 rcpts) ; Monthly Report Submission (3 rcpts) ; Urgent: Client Request (2 rcpts)"
                    vt_as_owner:
                        type: string
                        title: VT ASN Owner
                        default: "Unavailable"
                    vt_country:
                        type: string
                        title: VT Country Code
                        default: "N/A"
                    vt_reputation:
                        type: string
                        title: VT Reputation Score
                        default: "0"
                    primary_ip:
                        type: string
                        title: Primary Sign-in IP (24h)
                        default: "N/A"
                    low_freq_ip_list:
                        type: string
                        title: Low-Frequency Sign-in IPs (24h)
                        default: "None"
                    xdr_recipient_count:
                        type: string
                        title: XDR Total Recipients (2h)
                        default: "0"
                    bulk_email_count:
                        type: string
                        title: Bulk Email Count (2h)
                        default: "0"
                    detection_list:
                        type: string
                        title: Recent Detection List (3d)
                        default: "None"
                required:
                    - user_email
                    - baseline_total
                    - failure_count
                    - risk_event_count
                    - total_recent_detections
                    - distinct_recent_detection_types
                    - mfa_count
                    - total_signins
                    - unique_ips
                    - low_freq_ips
                    - total_rule_changes
                    - forward_rules
                    - external_forward_rules
                    - delete_rules
                    - bulk_subjects
                    - external_pct
                    - total_alerts
                    - distinct_alert_types
                    - smtp_auth_count
                    - smtp_pct
                    - total_client_events
                    - browser_count
                    - browser_pct
                    - desktop_count
                    - desktop_pct
                    - other_count
                    - browser_app
                    - desktop_app
                    - top_subjects
                    - top_5_subjects
                    - vt_as_owner
                    - vt_country
                    - vt_reputation
                    - primary_ip
                    - low_freq_ip_list
                    - xdr_recipient_count
                    - bulk_email_count
                    - detection_list
                type: object
                description: Count 24h sends and compute combined risk score (email volume 0-40 + email content 0-15 + auth anomaly 0-26 + client agent 0-5 + mailbox rules 0-15 + alerts correlation 0-15 - negative signals 0-6 = 0-116) with VT IP enrichment and XDR recipient count
            output_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    alerts_correlation_score:
                        type: string
                        title: Alerts Correlation Score (0-15)
                    attack_story:
                        type: string
                        title: Attack Story (one-line narrative)
                    auth_risk_score:
                        type: string
                        title: Auth Anomaly Risk Score (0-26)
                    case_description:
                        type: string
                        title: Case Description (full narrative)
                    client_agent_score:
                        type: string
                        title: Client Agent Risk Score (0-5)
                    current_emails:
                        type: string
                        title: Current Emails (24h)
                    daily_avg:
                        type: string
                        title: Daily Average
                    deviation_pct:
                        type: string
                        title: Deviation Percent
                    email_content_score:
                        type: string
                        title: Email Content Risk Score (0-15)
                    email_volume_score:
                        type: string
                        title: Email Volume Risk Score (0-40)
                    hygiene_bonus:
                        type: string
                        title: Mitigating Factors (negative signal)
                    hygiene_label:
                        type: string
                        title: Mitigating Factors Label (itemized breakdown)
                    ip_geo_score:
                        type: string
                        title: IP/Geo Risk Score (0-6)
                    mailbox_rules_score:
                        type: string
                        title: Mailbox Rules Risk Score (0-15)
                    risk_level:
                        type: string
                        title: Risk Level
                    risk_score:
                        type: string
                        title: Risk Score (combined)
                required:
                    - current_emails
                    - risk_score
                    - risk_level
                type: object
                description: Current volume and combined risk assessment
            config:
                description: Count 24h email sends and compute combined risk score (email volume 0-40 + email content 0-15 + auth anomaly 0-26 + client agent 0-5 + mailbox rules 0-15 + alerts correlation 0-15 - negative signals 0-6 = 0-116)
                end: now
                last_modified_by: nchurch@crowdstrike.com
                repo_or_view: search-all
                search_name: Calculate Risk Score v5.5.0
                search_query: |
                    #repo = "mimecast"
                    | #event.dataset = "emailsecurity.journal"
                    | _user_email := ?user_email | test(lower(_user_email) == lower(Vendor.senderEnvelope))
                    | count(as=current_emails)
                    | user_email_display := ?user_email
                    | top_subjects := ?top_subjects
                    | top_subjects := replace(field=top_subjects, regex=" ; ", with="\n")
                    | top_5_subjects := ?top_5_subjects
                    | top_5_subjects := replace(field=top_5_subjects, regex=" ; ", with="\n")
                    | baseline_total := ?baseline_total
                    | daily_avg := baseline_total / 30
                    | round(daily_avg)
                    | deviation_pct := if(current_emails == 0, then=0, else=if(daily_avg > 0, then=((current_emails - daily_avg) * 100) / daily_avg, else=999))
                    | round(deviation_pct)
                    | email_volume_score := if(deviation_pct >= 1000, then=40, else=if(deviation_pct >= 500, then=35, else=if(deviation_pct >= 300, then=30, else=if(deviation_pct >= 150, then=20, else=if(deviation_pct >= 50, then=10, else=0)))))
                    | failure_count := ?failure_count
                    | risk_event_count := ?risk_event_count
                    | mfa_count := ?mfa_count
                    | total_signins := ?total_signins
                    | auth_failure_score := if(failure_count >= 20, then=10, else=if(failure_count >= 10, then=7, else=if(failure_count >= 5, then=4, else=0)))
                    | auth_risk_flag_score := if(risk_event_count >= 3, then=10, else=if(risk_event_count >= 1, then=5, else=0))
                    | single_factor_ratio := if(total_signins > 0, then=((total_signins - mfa_count) * 100) / total_signins, else=0)
                    | round(single_factor_ratio)
                    | mfa_weakness_score := if(single_factor_ratio >= 90, then=3, else=if(single_factor_ratio >= 70, then=2, else=0))
                    | unique_ips := ?unique_ips
                    | low_freq_ips := ?low_freq_ips
                    | ip_diversity_score := if(unique_ips >= 8, then=2, else=if(unique_ips >= 5, then=1, else=0))
                    | low_freq_ip_score := if(low_freq_ips >= 3, then=1, else=0)
                    | ip_geo_score := ip_diversity_score + low_freq_ip_score
                    | smtp_auth_count := ?smtp_auth_count
                    | smtp_pct := ?smtp_pct
                    | total_client_events := ?total_client_events
                    | browser_count := ?browser_count
                    | browser_pct := ?browser_pct
                    | desktop_count := ?desktop_count
                    | desktop_pct := ?desktop_pct
                    | other_count := ?other_count
                    | browser_app := ?browser_app
                    | desktop_app := ?desktop_app
                    | vt_as_owner := ?vt_as_owner
                    | vt_country := ?vt_country
                    | vt_reputation := ?vt_reputation
                    | primary_ip := ?primary_ip
                    | low_freq_ip_list := ?low_freq_ip_list
                    | xdr_recipient_count := ?xdr_recipient_count
                    | bulk_email_count := ?bulk_email_count
                    | detection_list := ?detection_list
                    | smtp_base_score := if(smtp_auth_count >= 1, then=3, else=0)
                    | smtp_ratio_score := if(smtp_pct >= 50, then=2, else=0)
                    | client_agent_score := smtp_base_score + smtp_ratio_score
                    | bulk_subjects := ?bulk_subjects
                    | external_pct := ?external_pct
                    | bulk_pattern_score := if(bulk_subjects >= 2, then=5, else=if(bulk_subjects >= 1, then=3, else=0))
                    | external_ratio_score := if(external_pct >= 50, then=10, else=if(external_pct >= 25, then=5, else=if(external_pct >= 10, then=2, else=0)))
                    | email_content_score := bulk_pattern_score + external_ratio_score
                    | total_rule_changes := ?total_rule_changes
                    | forward_rules := ?forward_rules
                    | external_forward_rules := ?external_forward_rules
                    | delete_rules := ?delete_rules
                    | forward_score := if(external_forward_rules >= 1, then=10, else=if(forward_rules >= 1, then=3, else=0))
                    | delete_score := if(delete_rules >= 1, then=5, else=0)
                    | mailbox_rules_score_raw := forward_score + delete_score
                    | mailbox_rules_score := if(mailbox_rules_score_raw > 15, then=15, else=mailbox_rules_score_raw)
                    | mfa_strength_bonus := if(total_signins > 0, then=if(single_factor_ratio == 0, then=-3, else=0), else=0)
                    | clean_mailbox_bonus := if(total_rule_changes == 0, then=-3, else=0)
                    | hygiene_bonus := mfa_strength_bonus + clean_mailbox_bonus
                    | case {
                        mfa_strength_bonus <= -3 AND clean_mailbox_bonus <= -3 | hygiene_label := "All sign-ins used MFA: -3, No suspicious inbox rules created: -3";
                        mfa_strength_bonus <= -3 | hygiene_label := "All sign-ins used MFA: -3";
                        clean_mailbox_bonus <= -3 | hygiene_label := "No suspicious inbox rules created: -3";
                        * | hygiene_label := "no mitigating factors";
                      }
                    | auth_risk_score := auth_failure_score + auth_risk_flag_score + mfa_weakness_score + ip_geo_score
                    | total_alerts := ?total_alerts
                    | distinct_alert_types := ?distinct_alert_types
                    | alert_volume_score := if(total_alerts >= 6, then=8, else=if(total_alerts >= 3, then=5, else=if(total_alerts >= 1, then=2, else=0)))
                    | alert_diversity_score := if(distinct_alert_types >= 3, then=2, else=0)
                    | total_recent_detections := ?total_recent_detections
                    | distinct_recent_detection_types := ?distinct_recent_detection_types
                    | recent_detections_score := if(total_recent_detections >= 2, then=5, else=if(total_recent_detections >= 1, then=2, else=0))
                    | alerts_correlation_score_raw := alert_volume_score + alert_diversity_score + recent_detections_score
                    | alerts_correlation_score := if(alerts_correlation_score_raw > 15, then=15, else=alerts_correlation_score_raw)
                    | risk_score := email_volume_score + email_content_score + auth_risk_score + client_agent_score + mailbox_rules_score + alerts_correlation_score + hygiene_bonus
                    | risk_score := if(risk_score < 0, then=0, else=risk_score)
                    | risk_level := if(risk_score >= 40, then="HIGH", else=if(risk_score >= 20, then="MEDIUM", else="LOW"))
                    | case {
                        email_volume_score >= 30 | volume_narrative := format(format="Sent %s emails in 24 hours, %s%% above their normal baseline of %s/day.", field=[current_emails, deviation_pct, daily_avg]);
                        email_volume_score >= 10 | volume_narrative := format(format="Sent %s emails in 24 hours, %s%% above their normal baseline of %s/day.", field=[current_emails, deviation_pct, daily_avg]);
                        current_emails > 0       | volume_narrative := format(format="Sent %s emails in 24 hours (baseline: %s/day, %s%% deviation). Within normal range.", field=[current_emails, daily_avg, deviation_pct]);
                        *                        | volume_narrative := "No email send activity in the last 24 hours.";
                      }
                    | case {
                        email_content_score >= 10 | content_narrative := format(format="%s%% of recipients are external. Bulk defined as 100 or more emails sent in the last 2 hours.", field=[external_pct]);
                        email_content_score >= 3  | content_narrative := format(format="%s%% of recipients are external. Bulk defined as 100 or more emails sent in the last 2 hours.", field=[external_pct]);
                        *                         | content_narrative := "No unusual email content patterns.";
                      }
                    | case {
                        auth_risk_score >= 15 | auth_narrative := format(format="Significant auth concerns: %s failures, %s risk-flagged events out of %s total sign-ins, %s unique IPs over 7 days.", field=[failure_count, risk_event_count, total_signins, unique_ips]);
                        auth_risk_score >= 5  | auth_narrative := format(format="Minor auth signals: %s failures out of %s sign-ins, %s unique IPs over 7 days.", field=[failure_count, total_signins, unique_ips]);
                        *                     | auth_narrative := format(format="No significant authentication anomalies (%s sign-ins, %s failures over 7 days).", field=[total_signins, failure_count]);
                      }
                    | case {
                        client_agent_score >= 3 | client_agent_narrative := format(format="SMTP authentication detected: %s SMTP sign-ins out of %s total (%s%% SMTP).\nClient breakdown (24h): Browser %s%% (%s, apps: %s) | Desktop/Mobile %s%% (%s, apps: %s) | SMTP %s%% (%s) | Other %s", field=[smtp_auth_count, total_client_events, smtp_pct, browser_pct, browser_count, browser_app, desktop_pct, desktop_count, desktop_app, smtp_pct, smtp_auth_count, other_count]);
                        *                       | client_agent_narrative := format(format="No programmatic SMTP authentication detected (%s sign-in events in 24h).\nClient breakdown (24h): Browser %s%% (%s, apps: %s) | Desktop/Mobile %s%% (%s, apps: %s) | SMTP 0%% (0) | Other %s", field=[total_client_events, browser_pct, browser_count, browser_app, desktop_pct, desktop_count, desktop_app, other_count]);
                      }
                    | case {
                        mailbox_rules_score >= 10 | mailbox_narrative := format(format="SUSPICIOUS: External email forwarding rules detected (%s forwarding rules, %s external). %s delete rules found.", field=[forward_rules, external_forward_rules, delete_rules]);
                        mailbox_rules_score >= 3  | mailbox_narrative := format(format="Inbox rule changes detected: %s forwarding rules, %s delete rules in 7 days.", field=[forward_rules, delete_rules]);
                        *                         | mailbox_narrative := "No inbox rule changes in the last 7 days.";
                      }
                    | case {
                        alerts_correlation_score >= 5 | alerts_narrative := format(format="Other security alerts found: %s alerts across %s distinct types in 7 days. %s other detections across %s types in the last 3 days.", field=[total_alerts, distinct_alert_types, total_recent_detections, distinct_recent_detection_types]);
                        alerts_correlation_score >= 1 | alerts_narrative := format(format="%s other security alert(s) in the last 7 days. %s other detection(s) in the last 3 days.", field=[total_alerts, total_recent_detections]);
                        *                             | alerts_narrative := "No other security alerts or detections for this user recently.";
                      }
                    | case {
                        hygiene_bonus <= -6 | hygiene_narrative := format(format="All sign-ins used MFA and no inbox rule changes in 7 days (%s pts offset).", field=[hygiene_bonus]);
                        hygiene_bonus <= -3 | hygiene_narrative := format(format="Some mitigating factors found (%s pts offset). Checks: MFA on all sign-ins, no inbox rule changes in 7 days.", field=[hygiene_bonus]);
                        hygiene_bonus < 0   | hygiene_narrative := format(format="Minor mitigating factor (%s pts offset).", field=[hygiene_bonus]);
                        *                   | hygiene_narrative := "No mitigating factors found.";
                      }
                    | case {
                        email_volume_score >= 30 AND auth_risk_score >= 10 | primary_factors := "anomalous email volume combined with authentication concerns";
                        email_volume_score >= 30 AND mailbox_rules_score >= 10 | primary_factors := "anomalous email volume combined with suspicious mailbox rules";
                        email_volume_score >= 30 | primary_factors := "severely anomalous email volume";
                        email_volume_score >= 10 AND auth_risk_score >= 10 | primary_factors := "elevated email volume combined with authentication concerns";
                        email_volume_score >= 10 | primary_factors := "elevated email volume above baseline";
                        auth_risk_score >= 15 | primary_factors := "significant authentication anomalies";
                        mailbox_rules_score >= 10 | primary_factors := "suspicious mailbox rule configuration";
                        * | primary_factors := "combined risk signals";
                      }
                    | attack_story := format(format="%s was flagged for %s. %s", field=[user_email_display, primary_factors, volume_narrative])
