                end: now
                last_modified_by: nchurch@crowdstrike.com
                repo_or_view: search-all
                search_name: Query Client Agents (24h)
                search_query: |
                    #repo = "3pi_microsoft_entra_id"
                    | #event.dataset = "entraid.signin"
                    | user.name = ?user_email
                    | default(field="Vendor.properties.clientAppUsed", value="Unknown")
                    | default(field="Vendor.properties.appDisplayName", value="Unknown")
                    | case { Vendor.properties.clientAppUsed = "Browser" | cat_browser := 1 ; * | cat_browser := 0 }
                    | case { Vendor.properties.clientAppUsed = "Mobile Apps and Desktop clients" | cat_desktop := 1 ; * | cat_desktop := 0 }
                    | case { Vendor.properties.clientAppUsed = "Authenticated SMTP" | cat_smtp := 1 ; * | cat_smtp := 0 }
                    | case { Vendor.properties.clientAppUsed = "Browser" | browser_app := Vendor.properties.appDisplayName ; * | _x := 0 }
                    | case { Vendor.properties.clientAppUsed = "Mobile Apps and Desktop clients" | desktop_app := Vendor.properties.appDisplayName ; * | _y := 0 }
                    | [total_client_events := count(), browser_count := sum(cat_browser), desktop_count := sum(cat_desktop), smtp_auth_count := sum(cat_smtp), collect(browser_app, separator=", "), collect(desktop_app, separator=", ")]
                    | other_count := total_client_events - browser_count - desktop_count - smtp_auth_count
                    | browser_pct := if(total_client_events > 0, then=(browser_count * 100) / total_client_events, else=0)
                    | round(browser_pct)
                    | desktop_pct := if(total_client_events > 0, then=(desktop_count * 100) / total_client_events, else=0)
                    | round(desktop_pct)
                    | smtp_pct := if(total_client_events > 0, then=(smtp_auth_count * 100) / total_client_events, else=0)
                    | round(smtp_pct)
                    | default(field="browser_app", value="N/A")
                    | default(field="desktop_app", value="N/A")
                    | select([total_client_events, browser_count, browser_pct, desktop_count, desktop_pct, smtp_auth_count, smtp_pct, other_count, browser_app, desktop_app])
                search_query_args:
                    user_email: user@example.com
                start: 24h
                tags: []
        class: Inline.QueryEvent
        continue_on_error: true
        name: Query Client Agents (24h)
        next:
            - CalculateRiskScore
        properties:
            output_files_only: false
            user_email: ${data['WorkflowCustomVariable.UserEmail']}
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
        version_constraint: ~1
