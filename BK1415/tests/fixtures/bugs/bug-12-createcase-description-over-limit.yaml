                    unique_ips:
                        type: string
                        title: Unique IPs (7d)
                required:
                    - unique_ips
                    - low_freq_ips
                type: object
                description: IP diversity and low-frequency IP summary
            config:
                description: Two-stage groupBy for unique IP count and low-frequency IP detection (<=2 sign-ins in 7d)
                end: now
                last_modified_by: nchurch@crowdstrike.com
                repo_or_view: search-all
                search_name: Query IP/Geo Summary (7d)
