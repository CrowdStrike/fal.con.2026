                    | user.name = ?user_email
                    | groupBy([source.ip, source.geo.country_name], function=[count(as=auth_count)])
                    | case { auth_count <= 2 | low_freq_flag := 1 ; * | low_freq_flag := 0 }
                    | [unique_ips := count(), low_freq_ips := sum(low_freq_flag)]
                    | select([unique_ips, low_freq_ips])
                search_query_args:
                    user_email: user@example.com
                start: 168h
