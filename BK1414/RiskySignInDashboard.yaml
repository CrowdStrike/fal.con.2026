# =============================================================================
# Risky Sign-In Dashboard — Falcon Next-Gen SIEM
# Reference implementation. Fal.Con 2026 session BK-1414.
#
# Purpose: triage a specific Falcon case about a risky sign-in.
# Entry point: Email + sAMAccountName. Companion to the User Sign-in
# Activities dashboard, which answers the broader "what did this identity
# touch across all sources" question.
#
# CHANGEME — environment-specific values you MUST review before this works.
# Left as-is, the affected widgets return zero results rather than erroring.
#
#   1. falconUserIdentityContext.csv ("User Information Panel" widget): Requires 
#      Falcon Next-Gen Identity Security. Automatically generated by the module.
#
#   2. Timezone in formatTime() functions are set to UTC.
#      Set to your SOC's operating timezone.
#
#   3. Timeframes: Dashboard default is 7d. Several widgets override with
#      setTimeInterval(start="90d") — Top ISP, Top OS, Entra Audit Log — and
#      "30d" on Entra Logins / Duo MFA. Longer windows are deliberate: they
#      establish a behavioral baseline to judge whether a sign-in is anomalous.
#
#   4. Low-risk country watchlist  ("Cases for User" widget):
#      in(field=..., values=["CN","IR","KP","RU","SA","UA"]) — keeps low-risk
#      events only when they originate from these countries. Adjust to your 
#      environment.
#
# NOTE: This dashboard was built in a different environment than the User
# Sign-in Activities dashboard. Both are reference implementations, not a
# matched pair.
# =============================================================================
sections:
  section-defender-risky-users:
    description: Microsoft Defender risky users — medium/high severity focus. Shows
      unremediated Entra ID risk events requiring analyst attention.
    collapsed: false
    widgetIds:
    - widget-defender-risky-users-table
    order: 4
    title: Defender Risky Users
  section-case-status:
    description: Falcon Cases for the investigated user — all case types
    collapsed: false
    widgetIds:
    - widget-case-status-table
    order: 1
    title: Cases
  section-risk-overview:
    description: At-a-glance risk summary — risky sign-in trends and detection severity
    collapsed: false
    widgetIds:
    - widget-risksignins-timeline
    - widget-idp-severity-chart
    order: 5
    title: Risk Overview
  section-parameters:
    description: Enter user identity to populate all widgets
    collapsed: false
    widgetIds:
    - 2efa07bf-3864-42d6-a796-e793eced60d7
    - parameter-panel-1773750975075-0
    - note-risky-signin-analyst-guide
    order: 0
    title: User Identity
  section-entra-signins:
    description: Entra ID sign-in investigation — risk lifecycle, locations, and MFA
    collapsed: false
    widgetIds:
    - e609e5fc-b3a7-4551-94cc-625cd2ee947f
    - d886d197-ccb8-4d48-a68f-de9f5c9b1578
    - 5186c0e0-03be-4474-83e1-1503e10e992e
    - 60d9cc1a-535d-4e52-949d-d91d423bd0dd
    - widget-duo-mfa-table
    - e7710edd-9fd8-4457-8162-aa2b9361b8cc
    - widget-signin-map
    order: 2
    title: Entra Sign-Ins
  section-idp-detections:
    description: CrowdStrike Identity Protection detections (lower priority)
    collapsed: false
    widgetIds:
    - widget-idp-detections-table
    order: 6
    title: CrowdStrike IDP Detections
  section-user-context:
    description: User identity context and MFA history
    collapsed: false
    widgetIds:
    - 6885828d-d6bf-4739-a339-704f3152ea62
    order: 3
    title: Additional User Activity
  section-incidents:
    description: XDR incidents for the investigated user
    collapsed: true
    widgetIds:
    - widget-xdr-incidents-table
    order: 7
    title: Incidents
name: Risky Sign In Dashboard
updateFrequency: never
description: Single-pane-of-glass for investigating risky sign-in activity. Combines
  Microsoft Entra ID risk signals, CrowdStrike Identity Protection detections, CrowdStrike
  XDR incidents, Cisco Duo MFA, and Active Directory context. Enter a user's email
  (Username) and SAM account name to populate all widgets.
timeSelector: {}
sharedTimeInterval:
  enabled: true
  isLive: false
  start: 7d
widgets:
  widget-xdr-incidents-table:
    x: 0
    y: 0
    height: 5
    queryString: |-
      #repo=detections #event_simpleName="Event_XdrDetectionSummaryEvent"
      | EmailAddresses =~ in(values=?Email, ignoreCase=true)
      | formatTime(field=@timestamp, format="%Y-%m-%d %H:%M:%S", as="Time (UTC)", timezone="UTC")
      | format("[Incident Link](https://falcon.crowdstrike.com/xdr/incidents/%s)", field=[CompositeId], as="Incident Link")
      | table(["Time (UTC)", Name, "Incident Link", EmailAddresses, DataDomains, SourceProducts, HostNames, IPv4Addresses, SeverityName], limit=10000)
    end: now
    start: 7d
    width: 12
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns:
        SeverityName:
          color:
            conditions:
            - color: '#C93637'
              condition:
                arg: Critical
                type: Equal
            - color: '#FB7346'
              condition:
                arg: High
                type: Equal
            - color: '#F5B800'
              condition:
                arg: Medium
                type: Equal
            - color: '#34B248'
              condition:
                arg: Low
                type: Equal
      row-numbers-enabled: false
    visualization: table-view
    title: Incidents
    isLive: false
    type: query
  widget-idp-detections-table:
    x: 0
    y: 0
    height: 6
    queryString: |-
      #repo=detections #event_simpleName=Event_IdpDetectionSummaryEvent #event.kind = alert
      | SourceAccountName =~ in(values=?SAMAccountName, ignoreCase=true)
      | formatTime(field=@timestamp, format="%Y-%m-%d %H:%M:%S", as="Time (UTC)", timezone="UTC")
      | format("[Detection Link](%s)", field=["FalconHostLink"], as="Link")
      | rename([[SourceEndpointIpAddress, IP], [SeverityName, Severity]])
      | table(["Time (UTC)", SourceAccountName, IP, Severity, Description, Link], limit=10000)
    end: now
    start: 7d
    width: 12
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns:
        Severity:
          color:
            conditions:
            - color: '#C93637'
              condition:
                arg: Critical
                type: Equal
            - color: '#FB7346'
              condition:
                arg: High
                type: Equal
            - color: '#F5B800'
              condition:
                arg: Medium
                type: Equal
            - color: '#34B248'
              condition:
                arg: Low
                type: Equal
      row-numbers-enabled: false
    visualization: table-view
    title: Detections
    isLive: false
    type: query
  6885828d-d6bf-4739-a339-704f3152ea62:
    x: 0
    y: 0
    description: 'URLS clicked from emails'
    height: 4
    queryString: |-
      #Vendor="microsoft" #event.module="windows-defender-365"
      | Vendor.Workload = UrlClickEvents
      | source.user.name =~ in(values=?Email, ignoreCase=true)
      | table(@timestamp, source.user.name, url.original, event.action, @id)
    end: now
    start: 7d
    width: 12
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns: {}
      row-numbers-enabled: false
    visualization: table-view
    title: 'Clicked URLS '
    isLive: false
    type: query
  widget-signin-map:
    x: 9
    y: 6
    height: 4
    queryString: |-
      #Vendor="microsoft" #event.module="entraid" #event.dataset=entraid.signin
      | Vendor.properties.userPrincipalName =~ in(values=?Email, ignoreCase=true)
      | worldMap(ip=Vendor.properties.ipAddress)
    visualization: world-map
    end: now
    start: 7d
    width: 3
    title: Sign-In Locations
    isLive: false
    type: query
  note-risky-signin-analyst-guide:
    x: 7
    y: 0
    height: 5
    text: |-
      **How to use this dashboard**
      1. Enter the user's **Email** and **SAM Account Name** in the User Identity filters — all widgets populate from these.
      2. **Risk Level** (high / medium / low) narrows by Microsoft's assessed risk tier. Default `*` shows all tiers.
      3. **Cases** — one row per case, sorted by most-recently-modified. Click **Case Link** to open the Falcon case (the UI reference ID like "7E2-1416" is shown inside the case). Analyst workflow: open case → set In Progress → set your name → investigate → tag True Positive or False Positive → close.
      4. **Incidents** — XDR incidents for the user.
      5. **Defender Risky Users / IDP Detections** — supporting detection context. Right-click on IPs for VirusTotal / AbuseIPDB.
      6. **Entra Sign-Ins** — full sign-in history, locations map, and failed-MFA chart.
      7. **User Context & MFA** — AD attributes and Cisco Duo MFA history.

      **Key fields:** Risk Level = Microsoft's assessed tier (high / medium / low). Case Status = Falcon case state (new / in_progress / closed / reopened). additionalInfo = Microsoft's risk detail description (e.g. "unfamiliarFeatures", "anonymizedIPAddress").
    width: 5
    title: Analyst Guide
    type: note
  d886d197-ccb8-4d48-a68f-de9f5c9b1578:
    x: 0
    y: 10
    description: 'Top OS from Entra ID logs the last 90 days '
    height: 4
    queryString: |-
      setTimeInterval(start="90d")
      | #Vendor="microsoft" #event.module="entraid" #event.dataset=entraid.signin
      | Vendor.properties.userPrincipalName =~ in(values=?Email, ignoreCase=true)
      | formatTime(field=@timestamp, format="%Y-%m-%d %H:%M:%S", as="Time (UTC)", timezone="UTC")
      | rename([[Vendor.properties.ipAddress, IPAddress], [Vendor.properties.deviceDetail.operatingSystem, OS]])
      | asn(field=IPAddress, as=ISP)
      | format("%s/%s/%s", field=[City, State, Country], as=Location)
      | groupBy(OS)
      | sort(field=_count, order=desc)
    end: now
    start: 90d
    width: 3
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns: {}
      row-numbers-enabled: false
    visualization: table-view
    title: Top Operating Systems
    isLive: false
    type: query
  e7710edd-9fd8-4457-8162-aa2b9361b8cc:
    x: 0
    height: 6
    queryString: |-
      setTimeInterval(start="30d")
      | #Vendor="microsoft" #event.module="entraid" #event.dataset=entraid.signin
      | formatTime(field=@timestamp, format="%Y-%m-%d %H:%M:%S", as="Time (UTC)", timezone="UTC")
      | Vendor.properties.userPrincipalName =~ in(values=?Email, ignoreCase=true)
      | rename([[Vendor.properties.userPrincipalName, Username], [Vendor.properties.ipAddress, IPAddress], [Vendor.properties.deviceDetail.operatingSystem, OS], [Vendor.properties.location.city, City], [Vendor.properties.location.state, State], [Vendor.properties.location.countryOrRegion, Country], [Vendor.properties.appDisplayName, App], [Vendor.properties.deviceDetail.browser, Browser], [Vendor.properties.authenticationDetails[0].authenticationStepResultDetail, uthDetail], [user.id, ntraObjectId]])
      | asn(field=IPAddress,as=ISP)
      | format("%s/%s/%s",field=[City,State, Country],as=Location)
      // normalize the dedup key (adjust list if your events use a different field)
      | recordId := coalesce([recordId, id, Vendor.properties.id, Vendor.properties.recordId])
      // keep only one event per recordId (choose the newest ingested copy)
      | groupBy(field=[recordId], function=[
          selectFromMax(field="@ingesttimestamp", include=["Time (UTC)", Username, Vendor.riskLevelDuringSignIn, "IPAddress", ISP.org, Location, #event.outcome, OS, Browser, App, error.code, error.message, AuthDetails, Vendor.properties.status.additionalDetails, Vendor.properties.userAgent, EntraObjectId])
      ])
      | sort(field="Time (UTC)", order=desc, limit=max)
    end: now
    start: 7d
    width: 12
    y: 0
    interactions:
    - name: VirusTotal
      urlEncodeArgs: true
      urlTemplate: https://www.virustotal.com/gui/ip-address/{{ fields.IPAddress }}
      openInNewTab: true
      type: customlink
    - name: AbuseIPDB
      urlEncodeArgs: true
      urlTemplate: https://www.abuseipdb.com/check/{{ fields.IPAddress }}
      openInNewTab: true
      type: customlink
    - name: Spur
      urlEncodeArgs: true
      urlTemplate: https://app.spur.us/search?q= {{ fields.IPAddress }}
      openInNewTab: true
      type: customlink
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns:
        Vendor.properties.userAgent:
          width: 667
        '#event.outcome':
          color:
            conditions:
            - color: '#34B248'
              condition:
                arg: success
                type: Equal
            - color: '#C93637'
              condition:
                arg: failure
                type: Equal
        recordId:
          hidden: true
        error.message:
          width: 183
        Username:
          render-as: value
        EntraObjectId:
          hidden: true
      row-numbers-enabled: false
    visualization: table-view
    title: Entra ID Logins
    isLive: false
    type: query
  60d9cc1a-535d-4e52-949d-d91d423bd0dd:
    x: 7
    y: 14
    height: 4
    queryString: |-
      setTimeInterval(start="90d")
      | #Vendor="microsoft" #event.module="entraid" #event.dataset=entraid.signin
      | Vendor.properties.userPrincipalName =~ in(values=?Email, ignoreCase=true)
      | formatTime(field=@timestamp, format="%Y-%m-%d %H:%M:%S", as="Time (UTC)", timezone="UTC")
      | rename(field="Vendor.properties.ipAddress", as="IPAddress")
      | asn(field=IPAddress, as=ISP)
      | format("%s/%s/%s", field=[City, State, Country], as=Location)
      | groupBy(ISP.org)
      | sort(field=_count, order=desc)
    end: now
    start: 90d
    width: 4
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns: {}
      row-numbers-enabled: false
    visualization: table-view
    title: Top ISP Logins (Last 90 days)
    isLive: false
    type: query
  parameter-panel-1773750975075-0:
    x: 0
    y: 0
    parameterIds:
    - CaseStatus
    - CaseStatusExclude
    - Email
    - SAMAccountName
    - risk_level
    - tags
    height: 5
    width: 3
    title: User Identity
    type: parameterPanel
  e609e5fc-b3a7-4551-94cc-625cd2ee947f:
    x: 3
    height: 4
    queryString: |
      setTimeInterval(start="90d")
      | #Vendor="microsoft" #event.module="entraid" #event.dataset=entraid.audit
      | user.target.name =~ in(values=?Email, ignoreCase=true)
      | table(@timestamp, user.target.name, Vendor.properties.loggedByService, Vendor.properties.category, event.action, event.provider, Vendor.properties.initiatedBy.user.userPrincipalName, source.ip, Vendor.resultDescription )
    end: now
    start: 7d
    width: 9
    y: 10
    interactions:
    - name: VirusTotal
      urlEncodeArgs: true
      urlTemplate: https://www.virustotal.com/gui/ip-address/{{ fields.IPAddress }}
      openInNewTab: true
      type: customlink
    - name: AbuseIPDB
      urlEncodeArgs: true
      urlTemplate: https://www.abuseipdb.com/check/{{ fields.IPAddress }}
      openInNewTab: true
      type: customlink
    - name: Spur
      urlEncodeArgs: true
      urlTemplate: https://app.spur.us/search?q= {{ fields.IPAddress }}
      openInNewTab: true
      type: customlink
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns:
        '#event.outcome':
          color:
            conditions:
            - color: '#34B248'
              condition:
                arg: success
                type: Equal
            - color: '#C93637'
              condition:
                arg: failure
                type: Equal
        Username:
          render-as: value
        Vendor.properties.userAgent:
          width: 667
        error.message:
          width: 183
      row-numbers-enabled: false
    visualization: table-view
    title: Entra ID Audit Log
    isLive: false
    type: query
  2efa07bf-3864-42d6-a796-e793eced60d7:
    x: 3
    y: 0
    height: 5
    queryString: |-
      setTimeInterval(start="7d")
      | match(file="falconUserIdentityContext.csv", field=["user.email"], column=["user.email"], strict=true)
      | user.email =~ in(values=?Email, ignoreCase=true)
      | sort(@timestamp, order=desc)
      | head(1)
      | format("[IDP Profile](https://falcon.crowdstrike.com/identity-protection/entities/%s/about)", field=entityID, as="Full Profile")
      | format("SID: %s\nEmail: %s\nSAMAccountName: %s\nFull Name: %s\nDomain: %s\nCreation Date: %s\nTitle: %s\nDepartment: %s\nPassword Compromised: %s\nIs Watched: %s",
               field=["user.active_directory.sid", "user.email", "user.active_directory.samaccountname", "user.full_name", "user.active_directory.domain", "user.active_directory.creation_date", "user.title", "user.department", "user.active_directory.is_password_compromised", "user.is_watched"],
               as="Active Directory Info")
      | table(["Active Directory Info", "Full Profile"])
    end: now
    start: 4h
    width: 4
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns:
        Active Directory Info:
          color:
            conditions:
            - color: '#F04242FF'
              condition:
                arg: 'Password Compromised: true'
                type: Contains
      row-numbers-enabled: false
    visualization: table-view
    title: User Information Panel
    isLive: false
    type: query
  widget-risksignins-timeline:
    x: 0
    y: 0
    height: 4
    queryString: |-
      #Vendor="microsoft" #event.module="entraid" #event.dataset=entraid.signin
      | Vendor.properties.userPrincipalName =~ in(values=?Email, ignoreCase=true)
      | Vendor.properties.riskLevelDuringSignIn != "none"
      | Vendor.properties.riskLevelDuringSignIn != ""
      | timeChart(span=2h, function=count(), series=Vendor.properties.riskLevelDuringSignIn)
    end: now
    start: 7d
    width: 8
    options:
      connect-points: false
      imputation: none
      series:
        hidden:
          color: '#999999'
        high:
          color: '#C93637'
        low:
          color: '#126CC6'
        medium:
          color: '#F5B800'
    visualization: time-chart
    title: Risky Sign-Ins Over Time
    isLive: false
    type: query
  5186c0e0-03be-4474-83e1-1503e10e992e:
    x: 0
    y: 14
    description: Global Protect VPN logins
    height: 4
    queryString: |-
      // GlobalProtect Login Table
      #Vendor="paloalto" #event.dataset="ngfw" #event.dataset="ngfw.globalprotect"
      | Vendor.stage="configuration" or "login"
      | user.name =~ in(values=?SAMAccountName, ignoreCase=true)
      | table(@timestamp, user.name, #event.outcome,Vendor.stage, Vendor.MachineName, Vendor.PublicAddress, Vendor.private_ip, Vendor.DeviceName)
    end: now
    start: 7d
    width: 7
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns: {}
      row-numbers-enabled: false
    visualization: table-view
    title: VPN Logins
    isLive: false
    type: query
  widget-defender-risky-users-table:
    x: 0
    description: Microsoft Entra ID risky sign-in events where the user remains at
      risk (not auto-remediated by Conditional Access). Medium/high severity focus
      with sanctioned-country exceptions.
    height: 6
    queryString: |-
      #Vendor="microsoft" #event.module="entraid" #event.dataset=entraid.signin
      | Vendor.properties.userPrincipalName =~ in(values=?Email, ignoreCase=true)
      | Vendor.properties.riskLevelDuringSignIn != "none"
      | Vendor.properties.riskLevelDuringSignIn != ""
      | Vendor.properties.riskState = "atRisk"
      | formatTime(field=@timestamp, format="%Y-%m-%d %H:%M:%S", as="Time (UTC)", timezone="UTC")
      | rename([[Vendor.properties.userPrincipalName, User], [Vendor.properties.riskLevelDuringSignIn, Risk Level], [Vendor.properties.location.countryOrRegion, Country], [Vendor.properties.ipAddress, IP]])
      | asn(field=IP, as=ISP)
      | table(["Time (UTC)", User, "Risk Level", Vendor.properties.riskState, Country, IP, ISP.org, #event.outcome, Vendor.properties.conditionalAccessStatus], limit=10000)
    end: now
    start: 7d
    width: 12
    y: 0
    interactions:
    - name: VirusTotal
      urlEncodeArgs: true
      urlTemplate: https://www.virustotal.com/gui/ip-address/{{ fields.IP }}
      openInNewTab: true
      type: customlink
    - name: AbuseIPDB
      urlEncodeArgs: true
      urlTemplate: https://www.abuseipdb.com/check/{{ fields.IP }}
      openInNewTab: true
      type: customlink
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns:
        '#event.outcome':
          color:
            conditions:
            - color: '#34B248'
              condition:
                arg: success
                type: Equal
            - color: '#C93637'
              condition:
                arg: failure
                type: Equal
        Risk Level:
          color:
            conditions:
            - color: '#C93637'
              condition:
                arg: high
                type: Equal
            - color: '#F5B800'
              condition:
                arg: medium
                type: Equal
            - color: '#126CC6'
              condition:
                arg: low
                type: Equal
        Vendor.properties.riskState:
          color:
            conditions:
            - color: '#C93637'
              condition:
                arg: atRisk
                type: Equal
      row-numbers-enabled: false
    visualization: table-view
    title: Defender Risky Users (Unremediated)
    isLive: false
    type: query
  widget-idp-severity-chart:
    x: 8
    y: 0
    height: 4
    queryString: |-
      #repo=detections #event_simpleName=Event_IdpDetectionSummaryEvent #event.kind = alert
      | SourceAccountName =~ in(values=?SAMAccountName, ignoreCase=true)
      | groupBy(SeverityName, limit=max)
    end: now
    start: 7d
    width: 4
    options:
      series:
        Informational:
          color: '#126CC6'
        Medium:
          color: '#F5B800'
        High:
          color: '#FB7346'
        Low:
          color: '#34B248'
        Critical:
          color: '#C93637'
    visualization: bar-chart
    title: Detections by Severity
    isLive: false
    type: query
  widget-duo-mfa-table:
    x: 0
    y: 6
    height: 4
    queryString: |-
      setTimeInterval(start=30d)
      | #Vendor="cisco" #event.module="duo"
      | user.name =~ in(values=?SAMAccountName, ignoreCase=true)
      | Vendor.email=~ in(values=?Email, ignoreCase=true)
      | formatTime(field=@timestamp, format="%Y-%m-%d %H:%M:%S", as="Time (UTC)", timezone="UTC")
      | rename([[user.email, Email], [Vendor.access_device.ip, "Access Device IP"], [Vendor.application.name, Application]])
      | format("%s/%s/%s/\\n%s/%s/%s/%s\\n%s",field=[source.geo.city_name, source.geo.region_name, source.geo.country_name, user_agent.os.name, user_agent.os.version,user_agent.name, user_agent.version, Vendor.access_device.ip ], as="Access Device")
      | format("\%s\\n%s\\n%s\\n", field=[Vendor.auth_device.name,Vendor.auth_device.key, Vendor.auth_device.ip], as="Auth Device")
      | table(["Time (UTC)", user.name, Application, Vendor.result, Vendor.reason, "Access Device", "Auth Device"])
    end: now
    start: 7d
    width: 9
    options:
      cell-overflow: wrap-text
      column-overflow: truncate
      configured-columns:
        Vendor.result:
          color:
            conditions:
            - color: '#34B248'
              condition:
                arg: success
                type: Equal
            - color: '#C93637'
              condition:
                arg: denied
                type: Equal
            - color: '#FB7346FF'
              condition:
                arg: fraud
                type: Equal
      row-numbers-enabled: false
    visualization: table-view
    title: Duo MFA Challenges
    isLive: false
    type: query
  widget-case-status-table:
    x: 0
    description: 'Falcon Cases created by the Entra ID Risky User Detection correlation
      rule. Enriched with sign-in risk details: risk level, event type, IP, ISP, and
      location. Filter by Email Address or Case Status to narrow results.'
    height: 8
    queryString: |-
      #repo=xdr_indicatorsrepo "Ngsiem.indicator.display_name"="Entra ID Risky User Detection"
      | rename("CrowdStrike.AlertID", as=alert_composite_id)
      | join({
          #repo=detections OperationName=detection_update Attributes.link_case_id=*
          | rename([[Attributes.composite_id, alert_composite_id], [Attributes.link_case_id, case_id]])
        }, field=alert_composite_id, include=[case_id])
      | case_id != ""
      | join({
          #Vendor="microsoft" #event.module="entraid" #event.dataset="entraid.userrisk"
          | case {
            Vendor.properties.riskLevel!="low";
            Vendor.properties.riskLevel="low" | in(field=Vendor.properties.location.countryOrRegion, values=["CN", "IR", "KP", "RU", "SA", "UA"]);
                  }
          | rename([[Vendor.properties.userPrincipalName, Username], [Vendor.properties.ipAddress, IPAddress], [Vendor.properties.location.city, City], [Vendor.properties.location.state, State], [Vendor.properties.location.countryOrRegion, Country], [Vendor.properties.deviceDetail.browser, Browser]])
          | asn(field=IPAddress, as=ISP)
          | format("%s/%s/%s", field=[City, State, Country], as=Location)
          | groupBy([Ngsiem.alert.id, Username, IPAddress], function=selectLast(fields=[@timestamp, Vendor.properties.riskLevel, Vendor.properties.riskEventType, Vendor.properties.riskDetail, IPAddress, ISP.org, Location, Vendor.properties.riskState]), limit=max)
        }, field=Ngsiem.alert.id, include=[Username, IPAddress, City, State, Country, Vendor.properties.riskDetail, Browser, ISP.org, Location, Vendor.properties.riskEventType, Vendor.properties.riskState, Vendor.properties.riskLevel], mode=left)
      | join({
          #repo=detections Attributes.case_id=*
          | groupBy(Attributes.case_id, function=[
              max(@timestamp, as=case_modified),
              selectLast(Attributes.status),
              selectLast(Attributes.name),
              selectLast(Attributes.assign_to_email),
              selectLast(Attributes.severity),
              selectLast(Attributes.add_tag_0)
            ], limit=max)
          | rename([[Attributes.case_id, case_id], [Attributes.status, case_status], [Attributes.name, case_name], [Attributes.severity, case_severity], [Attributes.assign_to_email, assigned_analyst], [Attributes.add_tag_0, tags]])
        }, field=case_id, include=[case_status, case_name, case_severity, assigned_analyst, tags, case_modified])
      | eval(UsernameLC=lower(Username))
      | format("%s|%s", field=[UsernameLC, IPAddress], as=UserIPKey)
      | join({
          #Vendor="microsoft" #event.module=entraid #event.dataset=entraid.signin
          | rename(field="Vendor.properties.userPrincipalName", as=Username)
          | eval(UsernameLC=lower(Username))
          | rename(field="Vendor.properties.ipAddress", as=SignInIP)
          | format("%s|%s", field=[UsernameLC, SignInIP], as=UserIPKey)
          | rename([[Vendor.properties.deviceDetail.operatingSystem, OS], [Vendor.properties.appDisplayName, App]])
          | groupBy(UserIPKey, function=selectLast(fields=[OS, App]), limit=200000)
        }, field=UserIPKey, include=[OS, App], mode=left, limit=200000)
      | rename("Ngsiem.properties", as=props)
      | regex("\"EmailAddress\":\"(?<case_user>\S+)\"", field=props)
      | groupBy([case_id], function=selectLast(fields=[@timestamp, case_modified, case_status, case_name, case_severity, assigned_analyst, tags, Username, OS, App, IPAddress, ISP.org, Location, Vendor.properties.riskDetail, Vendor.properties.riskEventType, Vendor.properties.riskLevel, case_user]), limit=max)
      // | case_user =~ in(values=?Email, ignoreCase=true)
      | case_status =~ in(values=?CaseStatus, ignoreCase=true)
      | case_status != ?CaseStatusExclude
      | Vendor.properties.riskLevel =~ in(values=?risk_level, ignoreCase=true)
      | format("[View Case](https://falcon.crowdstrike.com/xdr/cases/%s)", field=[case_id], as="Case Link")
      | formatTime(field=@timestamp, format="%Y-%m-%d %H:%M", as="Created (UTC)", timezone="UTC")
      | formatTime(field=case_modified, format="%Y-%m-%d %H:%M", as="Modified (UTC)", timezone="UTC")
      | case {
          case_severity = 25  | Severity := "Low" ;
          case_severity = 50  | Severity := "Medium" ;
          case_severity = 75  | Severity := "High" ;
          case_severity = 100 | Severity := "Critical" ;
          *                   | Severity := "Unknown"
        }
      | replace("([a-z])([A-Z])", with="$1 $2", field=Vendor.properties.riskEventType)
      | replace("([a-z])([A-Z])", with="$1 $2", field=Vendor.properties.riskDetail)
      | replace("([A-Z]+)([A-Z][a-z])", with="$1 $2", field=Vendor.properties.riskDetail)
      | rename([[Vendor.properties.riskLevel, "Risk Level"], [Vendor.properties.riskEventType, "Risk Event"], [Vendor.properties.riskDetail, "Risk Detail"], [case_status, "Status"]])
      | sort(case_modified, order=desc, limit=10000)
      | tags =~ in(values=?tags, ignoreCase=true)
      | table(["Modified (UTC)", "Created (UTC)", "Case Link", Username, "Status", Severity, "Risk Level", "Risk Event", "Risk Detail", tags, assigned_analyst, OS, App, IPAddress, ISP.org, Location], limit=10000)
    end: now
    start: 90d
    width: 12
    y: 0
    interactions:
    - name: VirusTotal
      urlEncodeArgs: true
      urlTemplate: https://www.virustotal.com/gui/ip-address/{{ fields.IPAddress }}
      openInNewTab: true
      type: customlink
    - name: AbuseIPDB
      urlEncodeArgs: false
      urlTemplate: https://www.abuseipdb.com/check/{{ fields.IPAddress }}
      openInNewTab: true
      type: customlink
    - name: Spur
      urlEncodeArgs: true
      urlTemplate: https://app.spur.us/search?q= {{ fields.IPAddress }}
      openInNewTab: true
      type: customlink
    options:
      cell-overflow: truncate
      column-overflow: truncate
      configured-columns:
        Location:
          position: 11
        Created:
          hidden: true
          position: 1
        tags:
          color:
            conditions:
            - color: '#C93637'
              condition:
                arg: TruePositive
                type: Equal
          position: 4
          width: 165
        App:
          position: 13
        Risk Detail:
          position: 15
          width: 220
        Risk Level:
          color:
            conditions:
            - color: '#C93637'
              condition:
                arg: high
                type: Equal
            - color: '#F5B800'
              condition:
                arg: medium
                type: Equal
            - color: '#126CC6'
              condition:
                arg: low
                type: Equal
          position: 8
          width: 90
        Case Link:
          open-links-in-new-tab: true
          position: 2
        OS:
          position: 12
        assigned_analyst:
          position: 3
          width: 180
        Username:
          position: 6
          rename: Email
        IPAddress:
          position: 9
        Risk Event:
          position: 14
          width: 180
        ISP.org:
          position: 10
        Severity:
          hidden: true
          position: 7
          width: 80
        Modified:
          position: 0
          rename: Date
        Status:
          color:
            conditions:
            - color: '#F5B800'
              condition:
                arg: new
                type: Equal
            - color: '#126CC6'
              condition:
                arg: in_progress
                type: Equal
            - color: '#34B248'
              condition:
                arg: closed
                type: Equal
            - color: '#FB7346'
              condition:
                arg: reopened
                type: Equal
          position: 5
          width: 134
      row-numbers-enabled: false
    visualization: table-view
    title: Cases for User
    isLive: false
    type: query
$schema: https://schemas.humio.com/dashboard/v0.23.0
parameters:
  risk_level:
    label: Risk Level
    order: 3
    values:
    - '*'
    - high
    - medium
    - low
    type: list
    defaultValue: '*'
    width: 2
  CaseStatus:
    label: Case Status
    order: 4
    values:
    - '*'
    - new
    - in_progress
    - closed
    - reopened
    type: list
    defaultValue: '*'
    width: 2
  tags:
    order: 5
    values:
    - truepositive
    - falsepositive
    - '*'
    type: list
    defaultValue: '*'
    width: 1
  Email:
    label: Email Address
    order: 0
    type: text
    defaultValue: '*'
    width: 3
  CaseStatusExclude:
    label: Case Status (exclude)
    order: 2
    values:
    - (none)
    - new
    - in_progress
    - closed
    - reopened
    type: list
    defaultValue: (none)
    width: 2
  SAMAccountName:
    label: SAM Account Name
    order: 1
    type: text
    defaultValue: '*'
    width: 3
