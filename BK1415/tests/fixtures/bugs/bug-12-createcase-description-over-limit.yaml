    QueryDefenderIncidentID:
        id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
        inline_configuration:
            input_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    detection_id:
                        type: string
                        title: Detection ID
                        default: ""
                required:
                    - detection_id
                type: object
                description: Extract Defender incident ID from all dataset types
            output_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    incident_id:
                        type: string
                        title: Defender Incident ID (numeric)
                    dataset:
                        type: string
                        title: Event Dataset Type
                required:
                    - incident_id
                    - dataset
                type: object
                description: Incident ID and dataset type for routing
            config:
                description: Extract Defender incident ID from all three dataset types (incidents, alerts, saas-security)
                end: now
                last_modified_by: nchurch@crowdstrike.com
                repo_or_view: search-all
                search_name: Query Defender Incident ID
                search_query: |
                    #repo=xdr_indicatorsrepo
                    | Ngsiem.alert.id=?detection_id
                    | case {
                        #event.dataset="defender.incidents" | incident_id := Vendor.id ;
                        #event.dataset="defender.alerts" | incident_id := Vendor.incidentId ;
                        #Vendor="crowdstrike" | incident_id := Vendor.incidentId ;
                        * | incident_id := "" ;
                      }
                    | rename(field=#event.dataset, as=dataset)
                    | select([incident_id, dataset])
                    | head(1)
                search_query_args:
                    detection_id: ""
                start: 7d
                tags: []
        class: Inline.QueryEvent
        continue_on_error: true
        name: Query Defender Incident ID
        next:
            - QueryCasesByIncidentTag
        properties:
            detection_id: ${Trigger.Detection.DetectionID}
            output_files_only: false
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
        version_constraint: ~1
    GetUserContext:
        id: 19c7e2af0a24f468be7797fe180c8329
        class: GetUserIdentityContext
        continue_on_error: true
        name: Get User Identity Context
        next:
            - EnrichUserContext
        properties:
            continue_if_entity_not_found: true
            username: ${data['WorkflowCustomVariable.UserEmail']}
