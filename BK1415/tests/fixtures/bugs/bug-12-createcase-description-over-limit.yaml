    SetDetectionStatus:
        id: 7b77cb5d5ff2651cc51c7c4c610d54d1
        name: TESTING - Would close detection (new case)
        next:
            - SendEmail
        properties:
            comment: 'TESTING: Would close detection here (new case path). Case created for ${data[''WorkflowCustomVariable.UserEmail'']} with risk level ${data[''CalculateRiskScore.results''][0][''risk_level'']} (score ${data[''CalculateRiskScore.results''][0][''risk_score'']}).'
            investigatable_id: ${Trigger.Detection.DetectionID}
        version_constraint: ~0
    SetDetectionStatus2:
        id: 7b77cb5d5ff2651cc51c7c4c610d54d1
        name: TESTING - Would close detection (dedup)
        next: []
        properties:
            comment: 'TESTING: Would close detection here (dedup path). Detection added to existing case for ${data[''WorkflowCustomVariable.UserEmail'']} (lightweight path - risk scoring skipped for efficiency).'
            investigatable_id: ${Trigger.Detection.DetectionID}
        version_constraint: ~0
    SetInitialEmail:
        id: 51c4db34ab30465f796d7550f3e3e97b
        class: UpdateVariable
        name: Set Initial Email from Trigger
        next:
            - QueryDetectionData
        properties:
            WorkflowCustomVariable:
                UserEmail: ""
        version_constraint: ~1
conditions:
    detection_name_matches_email_sending_limit:
        next:
            - CreateVariable
        expression: Trigger.Detection.Name:'Email sending limit exceeded'
        display:
            - Detection name matches "Email sending limit exceeded"
    detection_query_returned_results:
        next:
            - DebugDetectionData
        cel_expression: data['QueryDetectionData.results'].size() > 0
        display:
            - Detection query returned results
        else:
            - NoDetectionData
    case_exists_incident:
        next:
            - AddDetectionsToCase
        cel_expression: data['QueryCasesByIncidentTag.cases'].size() > 0
        display:
            - Incident-tagged case found - use lightweight path
        else:
            - QueryCasesByUser
    case_exists_user:
        next:
            - AddDetectionsToCase
        cel_expression: data['QueryCasesByUser.cases'].size() > 0
        display:
            - User-level case found - use lightweight path
        else:
            - GetUserContext
    existing_mmb_case_found_for_this_user:
        next:
            - AddDetectionsToCase
        cel_expression: data['QueryCasesByIncidentTag.cases'].size() > 0 || data['QueryCasesByUser.cases'].size() > 0
        display:
            - Existing MMB case found for this user
        else:
            - CreateANewCase
    # v4.3 TEST CONFIGURATION: Always create cases regardless of risk level.
    # Kept intentionally for ongoing validation of case creation, email, and
    # companion detection close paths with real (low-risk) data.
    # Production workflow retains the risk_level != "LOW" gate.
    risk_level_is_high_or_medium___proceed_to_case_creation:
        next:
            - existing_mmb_case_found_for_this_user
        cel_expression: "true"
        display:
            - TEST OVERRIDE - always create case (all risk levels)
        else:
            - AddCommentToDetection
    case_exists:
        next:
            - AddDetectionsToCase
        cel_expression: data['QueryCasesByIncidentTag.cases'].size() > 0 || data['QueryCasesByUser.cases'].size() > 0
        display:
            - Existing MMB case found - use lightweight path
        else:
            - GetUserContext
    is_primary_detection:
        next:
            - ExtractUserEmail
        cel_expression: data['QueryDetectionDataset.results'].size() > 0 && data['QueryDetectionDataset.results'][0].dataset == "defender.alerts"
        display:
            - Primary detection (defender.alerts) - proceed to enrichment
        else:
            - CloseSiblingComment
output_fields:
    - Trigger.Detection.DetectionID
    - Trigger.Detection.Name
    - Trigger.Detection.NGSIEM.UserNames
    - WorkflowCustomVariable.UserEmail
    - WorkflowCustomVariable.EntitySid
    - WorkflowCustomVariable.UserDisplayName
    - WorkflowCustomVariable.UserPrincipalName
