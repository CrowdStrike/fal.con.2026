$schema: https://schemas.humio.com/dashboard/v0.23.0
parameters:
  username:
    label: Username (UPN/email)
    order: 0
    type: text
    defaultValue: '*'
    width: 1
  exclude_username:
    label: Exclude Username
    order: 4
    type: text
    defaultValue: ^*
    width: 1
  exclude_source_ip:
    label: Exclude Source IP
    order: 6
    type: text
    defaultValue: ^*
    width: 1
  outcome:
    label: Outcome (success / failure / disconnected / *)
    order: 1
    type: text
    defaultValue: '*'
    width: 1
  exclude_outcome:
    label: Exclude Outcome
    order: 5
    type: text
    defaultValue: ^*
    width: 1
  app_name:
    label: Entra SSO Apps
    query: |-
      #Vendor="microsoft" #event.module="entraid" #event.dataset="entraid.signin"
      //Exlcude "lifted" (duplicate) 3rd party events in xdr telemetry repos
      | #repo!=xdr*
      | user.name=?username
      | Vendor.properties.appDisplayName != ""
      | groupBy(Vendor.properties.appDisplayName, limit=max)
