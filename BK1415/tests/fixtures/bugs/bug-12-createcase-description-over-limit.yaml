    QueryEmailContent:
        id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
        inline_configuration:
            input_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    user_email:
                        type: string
                        title: User Email
                        default: user@example.com
                    observed_time:
                        type: string
                        title: Detection Observed Time (ISO8601)
                        default: "2026-01-01T00:00:00Z"
                required:
                    - user_email
                    - observed_time
                type: object
                description: Email content analysis - bulk patterns and external recipient ratio (2h window anchored to detection time)
            output_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    bulk_subjects:
                        type: string
                        title: Bulk Subjects (100+ recipients, 2h)
                    bulk_email_count:
                        type: string
                        title: Bulk Email Count (100+ recipients, 2h)
                    external_pct:
                        type: string
                        title: External Recipient Percent (24h)
                    total_external:
                        type: string
                        title: External Recipients (24h)
                    total_internal:
                        type: string
                        title: Internal Recipients (24h)
                    total_recipients:
                        type: string
                        title: Total Recipients (24h)
                    total_subjects:
                        type: string
                        title: Distinct Email Subjects (24h)
                required:
                    - total_subjects
                    - bulk_subjects
                    - total_recipients
                    - external_pct
                    - bulk_email_count
                type: object
                description: Email content pattern summary - bulk sends and internal/external ratio (2h)
            config:
                description: Analyze 2h email content patterns - bulk subjects (100+ recipients), internal vs external recipients
                end: now
                last_modified_by: nchurch@crowdstrike.com
                repo_or_view: search-all
                search_name: Query Email Content (2h)
                search_query: |
                    #repo = "mimecast"
                    | #event.dataset = "emailsecurity.journal"
                    | _user_email := ?user_email | test(lower(_user_email) == lower(Vendor.senderEnvelope))
                    | _detection_ts := ?observed_time
                    | parseTimestamp(field=_detection_ts, as=_obs_epoch)
                    | test(@timestamp > (_obs_epoch - duration("2h")))
                    | test(@timestamp <= _obs_epoch)
                    | email.subject = *
                    | case { email.to.address[0] = /.*@example\.com$/i | is_internal := 1 ; * | is_internal := 0 }
                    | groupBy([email.subject], function=[count(as=rcpt_count), sum(is_internal, as=internal_rcpts)])
                    | bulk_flag := if(rcpt_count >= 100, then=1, else=0)
                    | bulk_email_flag := if(rcpt_count >= 100, then=rcpt_count, else=0)
                    | [total_subjects := count(), bulk_subjects := sum(bulk_flag), total_recipients := sum(rcpt_count), total_internal := sum(internal_rcpts), bulk_email_count := sum(bulk_email_flag)]
                    | total_external := total_recipients - total_internal
                    | external_pct := if(total_recipients > 0, then=(total_external * 100) / total_recipients, else=0)
                    | round(external_pct)
                    | select([total_subjects, bulk_subjects, total_recipients, total_internal, total_external, external_pct, bulk_email_count])
                search_query_args:
                    user_email: user@example.com
                    observed_time: "2026-01-01T00:00:00Z"
                start: 24h
                tags: []
        class: Inline.QueryEvent
        continue_on_error: true
        name: Query Email Content (2h)
        next:
            - CalculateRiskScore
        properties:
            observed_time: ${data['QueryDetectionData.results'][0]['detection_time']}
            output_files_only: false
            user_email: ${data['WorkflowCustomVariable.UserEmail']}
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
        version_constraint: ~1
    QueryEmailSubjects:
        id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
        inline_configuration:
            input_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    user_email:
                        type: string
                        title: User Email
                    observed_time:
                        type: string
                        title: Detection Observed Time (ISO8601)
                        default: "2026-01-01T00:00:00Z"
                required:
                    - user_email
                    - observed_time
                type: object
            output_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    top_subjects:
                        type: string
                        title: Bulk Subjects (100+ recipients, 2h)
                    top_5_subjects:
                        type: string
                        title: Top 5 Subjects by recipient count (2h)
                required:
                    - top_subjects
                    - top_5_subjects
                type: object
            config:
                description: Bulk email subjects (100+ recipients) and top 5 subjects by recipient count in 2h window
                end: now
                last_modified_by: nchurch@crowdstrike.com
                repo_or_view: search-all
                search_name: Query Bulk Subjects (2h)
                search_query: |
                    #repo = "mimecast"
                    | #event.dataset = "emailsecurity.journal"
                    | _user_email := ?user_email | test(lower(_user_email) == lower(Vendor.senderEnvelope))
                    | _detection_ts := ?observed_time
                    | parseTimestamp(field=_detection_ts, as=_obs_epoch)
                    | test(@timestamp > (_obs_epoch - duration("2h")))
                    | test(@timestamp <= _obs_epoch)
                    | email.subject = *
                    | groupBy([email.subject], function=[count(as=rcpt_count)])
                    | sort(rcpt_count, order=desc)
                    | format(format="%s (%s rcpts)", field=[email.subject, rcpt_count], as=subject_line)
                    | _group := "all"
                    | groupBy([_group], function=[
                        {rcpt_count >= 100 | sort(rcpt_count, order=asc, type=number) | collect(subject_line, separator=" ; ")},
                        {sort(rcpt_count, order=desc, type=number) | head(5) | top_5_subjects := subject_line | collect(top_5_subjects, separator=" ; ")}
                      ])
                    | rename(field=subject_line, as=top_subjects)
                    | case {
                        top_subjects = * | top_subjects := top_subjects;
                        * | top_subjects := "None";
                      }
                search_query_args:
                    user_email: user@example.com
                    observed_time: "2026-01-01T00:00:00Z"
                start: 24h
                tags: []
        class: Inline.QueryEvent
        continue_on_error: true
        name: Query Bulk Subjects (2h)
        next:
            - CalculateRiskScore
        properties:
            observed_time: ${data['QueryDetectionData.results'][0]['detection_time']}
            output_files_only: false
            user_email: ${data['WorkflowCustomVariable.UserEmail']}
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
        version_constraint: ~1
    QueryHistoricalBaseline:
