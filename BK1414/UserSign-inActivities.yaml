        }
      | Outcome=?outcome
      | !Outcome=?exclude_outcome
      | TimeStr := formatTime(format="%Y-%m-%d %H:%M:%S", field=@timestamp)
      | table([TimeStr, user.name, client.ip, source.geo.city_name, source.geo.country_iso_code, Outcome, event.start], limit=10000)
      | rename([[TimeStr, Time], [user.name, User], [client.ip, "Source IP"], [source.geo.city_name, City], [source.geo.country_iso_code, Country], [Outcome, Result], [event.start, "Auth Time"]])
