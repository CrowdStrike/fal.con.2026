    QuerySignInIP:
        id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
        inline_configuration:
            input_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    user_email:
                        type: string
                        title: User Email
                        default: user@example.com
                required:
                    - user_email
                type: object
                description: Extract primary sign-in IP (most active) and low-frequency IPs from 24h Entra ID sign-ins
            output_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    primary_ip:
                        type: string
                        title: Primary Sign-in IP (24h)
                    low_freq_ip_list:
                        type: string
                        title: Low-Frequency Sign-in IPs (24h, <=2 sign-ins)
                required:
                    - primary_ip
                    - low_freq_ip_list
                type: object
                description: Primary IP for VT lookup and low-frequency IP list for analyst review
            config:
                description: Extract primary (most active) sign-in IP and collect low-frequency IPs from 24h Entra ID sign-ins
                end: now
                last_modified_by: nchurch@crowdstrike.com
                repo_or_view: search-all
                search_name: Query Sign-In IP (24h)
                search_query: |
                    #repo = "3pi_microsoft_entra_id"
                    | #event.dataset = "entraid.signin"
                    | user.name = ?user_email
                    | groupBy([source.ip], function=[count(as=signin_count)])
                    | sort(signin_count, order=desc)
                    | case { signin_count <= 2 | low_freq_flag := 1 ; * | low_freq_flag := 0 }
                    | case { low_freq_flag = 1 | low_freq_ip_entry := format(format="%s (%s sign-ins)", field=[source.ip, signin_count]) ; * | low_freq_ip_entry := "" }
                    | _group := "all"
                    | groupBy([_group], function=[
                        {head(1) | collect(source.ip, separator=",")},
                        {test(low_freq_flag == 1) | collect(low_freq_ip_entry, separator=" ; ")}
                      ])
                    | rename(field="source.ip", as="primary_ip")
                    | rename(field="low_freq_ip_entry", as="low_freq_ip_list")
                    | default(field="low_freq_ip_list", value="None")
                    | default(field="primary_ip", value="unknown")
                    | select([primary_ip, low_freq_ip_list])
                search_query_args:
                    user_email: user@example.com
                start: 24h
                tags: []
        class: Inline.QueryEvent
        continue_on_error: true
        name: Query Sign-In IP (24h)
        next:
            - VirusTotalIPLookup
        properties:
            output_files_only: false
            user_email: ${data['WorkflowCustomVariable.UserEmail']}
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
