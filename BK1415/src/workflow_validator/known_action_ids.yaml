# Known built-in Falcon Fusion action IDs.
#
# These action UUIDs are global Falcon platform activity document IDs — they
# identify built-in actions that DO NOT need an explicit `class:` field in
# workflow YAML because Fusion infers the class from the id at import time.
#
# The workflow validator suppresses MISSING_ACTION_CLASS (INFO) for any action
# whose `id:` appears in this file.
#
# Source of truth:
#   - /Users/nchurch/.claude/learnings/fusion-action-docids-purpletunnel.md
#     (global platform IDs confirmed across multiple CIDs)
#   - Additional ids observed in ~/clients/*/workflows/*.yaml with >20 usages.
#
# Add new entries here as new built-in actions are encountered. Keep the
# human-readable name as a YAML comment for grep-ability.

