                    | select([baseline_total, current_emails, daily_avg, deviation_pct, email_volume_score, email_content_score, auth_risk_score, client_agent_score, mailbox_rules_score, alerts_correlation_score, hygiene_bonus, hygiene_label, risk_score, risk_level, failure_count, risk_event_count, mfa_count, total_signins, single_factor_ratio, mfa_weakness_score, unique_ips, low_freq_ips, ip_geo_score, smtp_auth_count, smtp_pct, browser_count, browser_pct, desktop_count, desktop_pct, other_count, browser_app, desktop_app, bulk_subjects, external_pct, total_rule_changes, forward_rules, external_forward_rules, delete_rules, total_alerts, distinct_alert_types, total_recent_detections, distinct_recent_detection_types, recent_detections_score, mfa_strength_bonus, clean_mailbox_bonus, top_subjects, top_5_subjects, vt_as_owner, vt_country, vt_reputation, primary_ip, low_freq_ip_list, xdr_recipient_count, bulk_email_count, detection_list, attack_story, case_description])
                search_query_args:
                    baseline_total: "0"
