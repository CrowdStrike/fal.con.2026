# =============================================================================
# User Sign-in Activities Dashboard — Falcon Next-Gen SIEM
#
# Reference implementation. Fal.Con 2026 session BK-1414.
#
# CHANGEME — environment-specific values you MUST review before this works.
# Every item below is specific to the environment this was built in. Left
# as-is, the affected widgets return zero results rather than erroring, so
# verify each one instead of assuming an empty widget means "no activity."
#
#   1. Windows AD noise exclusions (Windows AD widget; Success/Failure widget)
#      LogonType restricted to 2, 7, 9, 10, 11 (interactive / RDP only).
#      TargetDomainName excludes "Window Manager", "Font Driver Host",
#      "NT AUTHORITY". Tune to your own service-account and OS noise.
#
#   2. VMware vCenter exclusion: !user.name=*@127.0.0.1*
#      Drops loopback service sessions. Adjust to your automation accounts.
#
#   3. Zscaler ZPA exclusion: user.name!="ZPA IP Anchor"
#      Synthetic ZPA identity, not a real user.
#
#   4. Service accounts are NOT hard-coded out.
#      Exclude them at runtime with the "Exclude Username" parameter. This is
#      intentional — the list is environment-specific and analysts wanted
#      control. Hard-code them here if you would rather they never appear.
#
# NOTE ON COVERAGE: Success/Failure by Source covers all 13 sources. The Timeline, 
# Source IP Summary, and Country widgets cover only the four highest-volume sources 
# for the example implementation (Entra ID, Defender Identity, ZPA, Salesforce). 
# Extend those OR blocks if you want full coverage in the summary widgets.
# =============================================================================
