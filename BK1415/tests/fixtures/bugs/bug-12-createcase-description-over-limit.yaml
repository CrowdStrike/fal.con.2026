    QueryAlertHistory:
        id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
        inline_configuration:
            input_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    user_email:
                        type: string
                        title: User Email
                        default: user@example.com
                required:
                    - user_email
                type: object
                description: Alert history - other NG-SIEM alerts for this user (7d), excluding MMB trigger
            output_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    distinct_alert_types:
                        type: string
                        title: Distinct Alert Types (7d)
                    high_volume_alert_types:
                        type: string
                        title: High-Volume Alert Types (5+ instances, 7d)
                    total_alerts:
                        type: string
                        title: Total Other Alerts (7d)
                required:
                    - total_alerts
                    - distinct_alert_types
                    - high_volume_alert_types
                type: object
                description: Summary of other security alerts for this user (excluding MMB trigger)
            config:
                description: Two-stage groupBy for 7d alert history - total alerts, distinct types, high-volume types
                end: now
                last_modified_by: nchurch@crowdstrike.com
                repo_or_view: search-all
                search_name: Query Alert History (7d)
                search_query: |
                    #repo = "xdr_indicatorsrepo"
                    | Ngsiem.alert.id = *
                    | user.email = ?user_email
                    | not(threat.indicator.name = "Email sending limit exceeded")
                    | groupBy([threat.indicator.name, Ngsiem.event.vendor], function=[count(as=alert_count)])
                    | case { alert_count >= 5 | high_volume_flag := 1 ; * | high_volume_flag := 0 }
                    | [total_alerts := sum(alert_count), distinct_alert_types := count(), high_volume_alert_types := sum(high_volume_flag)]
                    | select([total_alerts, distinct_alert_types, high_volume_alert_types])
                search_query_args:
                    user_email: user@example.com
                start: 168h
                tags: []
        class: Inline.QueryEvent
        continue_on_error: true
        name: Query Alert History (7d)
        next:
            - CalculateRiskScore
        properties:
            output_files_only: false
            user_email: ${data['WorkflowCustomVariable.UserEmail']}
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
        version_constraint: ~1
