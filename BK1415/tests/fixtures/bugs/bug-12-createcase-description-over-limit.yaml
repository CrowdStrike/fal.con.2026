    QueryMailboxRules:
        id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
        inline_configuration:
            input_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    user_email:
                        type: string
                        title: User Email
                        default: user@example.com
                required:
                    - user_email
                type: object
                description: Mailbox rules analysis - suspicious inbox rule changes (7d)
            output_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    delete_rules:
                        type: string
                        title: Delete Rules (7d)
                    external_forward_rules:
                        type: string
                        title: External Forwarding Rules (7d)
                    forward_rules:
                        type: string
                        title: Forwarding Rules (7d)
                    total_rule_changes:
                        type: string
                        title: Total Rule Changes (7d)
                required:
                    - total_rule_changes
                    - forward_rules
                    - external_forward_rules
                    - delete_rules
                type: object
                description: Mailbox rule change summary with suspicious pattern flags
            config:
                description: Query 7d inbox rule changes, flag forwarding (internal vs external) and delete rules
                end: now
                last_modified_by: nchurch@crowdstrike.com
                repo_or_view: search-all
                search_name: Query Mailbox Rules (7d)
                search_query: |
                    #repo = "microsoft_exchange_online"
                    | #event.dataset = "exchange.ExchangeAdmin"
                    | user.email = ?user_email
                    | event.action = "New-InboxRule" OR event.action = "Set-InboxRule"
                    | case { Vendor.Parameters.ForwardTo = * OR Vendor.Parameters.ForwardAsAttachmentTo = * OR Vendor.Parameters.RedirectTo = * | has_forward := 1 ; * | has_forward := 0 }
                    | case { Vendor.Parameters.DeleteMessage = "True" OR Vendor.Parameters.MoveToFolder = "Deleted Items" | has_delete := 1 ; * | has_delete := 0 }
                    | default(field=Vendor.Parameters.ForwardTo, value="")
                    | default(field=Vendor.Parameters.ForwardAsAttachmentTo, value="")
                    | default(field=Vendor.Parameters.RedirectTo, value="")
                    | case {
                        has_forward = 1 AND Vendor.Parameters.ForwardTo = /.*@example\.com$/i
                          | has_external_forward := 0 ;
                        has_forward = 1 AND Vendor.Parameters.ForwardAsAttachmentTo = /.*@example\.com$/i
                          | has_external_forward := 0 ;
                        has_forward = 1 AND Vendor.Parameters.RedirectTo = /.*@example\.com$/i
                          | has_external_forward := 0 ;
                        has_forward = 1
                          | has_external_forward := 1 ;
                        *
                          | has_external_forward := 0
                      }
                    | [total_rule_changes := count(), forward_rules := sum(has_forward), external_forward_rules := sum(has_external_forward), delete_rules := sum(has_delete)]
                    | select([total_rule_changes, forward_rules, external_forward_rules, delete_rules])
                search_query_args:
                    user_email: user@example.com
                start: 168h
                tags: []
        class: Inline.QueryEvent
        continue_on_error: true
        name: Query Mailbox Rules (7d)
        next:
            - CalculateRiskScore
        properties:
            output_files_only: false
            user_email: ${data['WorkflowCustomVariable.UserEmail']}
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
        version_constraint: ~1
    QueryXDRRecipientCount:
        id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
        inline_configuration:
            input_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    user_email:
                        type: string
                        title: User Email
                        default: user@example.com
                    observed_time:
                        type: string
                        title: Detection Observed Time (ISO8601)
                        default: "2026-01-01T00:00:00Z"
                required:
                    - user_email
                    - observed_time
                type: object
                description: XDR total recipient count - DL-expanded outbound email events (2h window anchored to detection time)
            output_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    xdr_recipient_count:
                        type: string
                        title: XDR Total Recipients (2h)
                required:
                    - xdr_recipient_count
                type: object
                description: Total outbound email recipient count from XDR (captures DL-expanded recipients that Mimecast misses)
            config:
                description: Count outbound email events from XDR (one row per DL-expanded recipient) for 2h window anchored to detection time
                end: now
                last_modified_by: nchurch@crowdstrike.com
                repo_or_view: search-all
                search_name: Query XDR Recipient Count (2h)
                search_query: |
                    #repo = microsoft_defender_xdr
                    | #event.dataset = "windows-defender-365.event"
                    | Vendor.properties.SenderFromAddress = ?user_email
                    | _detection_ts := ?observed_time
                    | parseTimestamp(field=_detection_ts, as=_obs_epoch)
                    | test(@timestamp > (_obs_epoch - duration("2h")))
                    | test(@timestamp <= _obs_epoch)
                    | count(as=xdr_recipient_count)
                search_query_args:
                    user_email: user@example.com
                    observed_time: "2026-01-01T00:00:00Z"
                start: 24h
                tags: []
        class: Inline.QueryEvent
        continue_on_error: true
        name: Query XDR Recipient Count (2h)
        next:
            - CalculateRiskScore
        properties:
            observed_time: ${data['QueryDetectionData.results'][0]['detection_time']}
            output_files_only: false
            user_email: ${data['WorkflowCustomVariable.UserEmail']}
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
        version_constraint: ~1
    QueryRecentDetections:
        id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
        inline_configuration:
            input_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    current_detection_id:
                        type: string
                        title: Current Detection ID
                        default: ""
                    user_email:
                        type: string
                        title: User Email
                        default: user@example.com
                required:
                    - user_email
                type: object
                description: Query other detections for this user in the last 3 days (any type), excluding the current trigger detection
            output_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    detection_list:
                        type: string
                        title: Detection List (names and counts, 3d)
                    distinct_detection_types:
                        type: string
                        title: Distinct Detection Types (3d)
                    total_recent_detections:
                        type: string
                        title: Total Recent Detections (3d)
                required:
                    - total_recent_detections
                    - distinct_detection_types
                type: object
                description: Count of other detections and distinct types for this user in 3 days
            config:
                description: Query 3d detections for same user, excluding current trigger, count totals and distinct types
                end: now
                last_modified_by: nchurch@crowdstrike.com
                repo_or_view: search-all
                search_name: Query Recent Detections (3d)
                search_query: |
                    #repo = "xdr_indicatorsrepo"
                    | Ngsiem.alert.id = *
                    | user.email = ?user_email
                    | Ngsiem.alert.id != ?current_detection_id
                    | groupBy([threat.indicator.name], function=[count(as=det_count)])
                    | format(format="%s (x%s)", field=[threat.indicator.name, det_count], as=det_line)
                    | sort(det_count, order=desc)
                    | head(10)
                    | _group := "all"
                    | groupBy([_group], function=[sum(det_count, as=total_recent_detections), count(as=distinct_detection_types), {sort(det_count, order=desc) | collect(det_line)}])
                    | rename(field=det_line, as=detection_list)
                    | default(field=detection_list, value="None")
                    | default(field=total_recent_detections, value="0")
                    | default(field=distinct_detection_types, value="0")
                    | select([total_recent_detections, distinct_detection_types, detection_list])
                search_query_args:
                    current_detection_id: ""
                    user_email: user@example.com
                start: 72h
                tags: []
        class: Inline.QueryEvent
        continue_on_error: true
        name: Query Recent Detections (3d)
        next:
            - CalculateRiskScore
        properties:
            current_detection_id: ${Trigger.Detection.DetectionID}
            output_files_only: false
            user_email: ${data['WorkflowCustomVariable.UserEmail']}
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
        version_constraint: ~1
